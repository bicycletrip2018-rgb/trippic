<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TRIPPIC — 지도 렌더링 프로토타입</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  :root{
    --map-bg:#0E0F13;
    --region-empty:#16181F;
    --region-stroke:rgba(255,255,255,0.08);
    --region-stroke-visited:rgba(255,255,255,0.22);
    --surface-glass:rgba(22,24,31,0.72);
    --surface-line:rgba(255,255,255,0.10);
    --text-primary:#F2F3F5;
    --text-muted:#8A8F9A;
    --accent:#38B6FF;
    --on-accent:#04233A;   /* 파랑 위 글씨 — 흰색은 대비 2.3:1이라 못 쓴다 */
  }
  :root[data-theme="light"]{
    --map-bg:#FAF9F7;
    --region-empty:#F1EFEC;
    --region-stroke:rgba(0,0,0,0.07);
    --region-stroke-visited:rgba(0,0,0,0.18);
    --surface-glass:rgba(255,255,255,0.80);
    --surface-line:rgba(0,0,0,0.08);
    --text-primary:#16181F;
    --text-muted:#6B7078;
    --accent:#0A7CC9;      /* 밝은 바탕에선 한 단계 짙게 — 글씨로 쓰여도 읽혀야 한다 */
    --on-accent:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--map-bg);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow:hidden}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{display:none}

  /* ---- floating glass UI ---- */
  .glass{background:var(--surface-glass);backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border:1px solid var(--surface-line);border-radius:16px}

  #header{position:absolute;top:14px;left:14px;right:14px;z-index:5;
    display:flex;align-items:center;gap:10px;padding:10px 14px}
  #layer{font-size:15px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
  #layer small{color:var(--text-muted);font-weight:500;font-size:11px;display:block;margin-top:1px}
  #cov{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
  #cov b{font-size:17px;font-weight:700;letter-spacing:-.4px}
  #cov span{display:block;font-size:11px;color:var(--text-muted);margin-top:1px}

  #panel{position:absolute;left:14px;bottom:14px;z-index:5;padding:14px;width:288px;max-width:calc(100vw - 28px)}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .row:last-child{margin-bottom:0}
  .lab{font-size:11px;color:var(--text-muted);width:62px;flex:none;letter-spacing:.2px}
  .seg{display:flex;gap:4px;flex:1}
  .seg button{flex:1;padding:7px 4px;font-size:11.5px;font-weight:600;border-radius:9px;cursor:pointer;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-muted);
    font-family:inherit;transition:.14s}
  .seg button:hover{color:var(--text-primary)}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  #bench{width:100%;padding:10px;border-radius:11px;border:1px solid var(--surface-line);
    background:transparent;color:var(--text-primary);font-weight:700;font-size:12.5px;
    cursor:pointer;font-family:inherit;margin-top:2px}
  #bench:hover{border-color:var(--accent);color:var(--accent)}
  #bench:disabled{opacity:.5;cursor:default}

  #stats{position:absolute;right:14px;bottom:14px;z-index:5;padding:12px 14px;width:216px;
    font-variant-numeric:tabular-nums;font-size:11.5px;line-height:1.75}
  #stats h4{margin:0 0 7px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);font-weight:700}
  #stats .s{display:flex;justify-content:space-between;gap:10px}
  #stats .s i{font-style:normal;color:var(--text-muted)}
  #stats .s b{font-weight:600}
  .good{color:#4ADE80}.warn{color:#FBBF24}.bad{color:#F87171}

  #hover{position:absolute;z-index:6;pointer-events:none;padding:5px 10px;border-radius:9px;
    font-size:12px;font-weight:600;opacity:0;transform:translate(-50%,-140%);transition:opacity .12s;white-space:nowrap}
  #hover.on{opacity:1}

  #fpsbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:7;
    padding:7px 16px;border-radius:999px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
    opacity:0;transition:.2s;pointer-events:none}
  #fpsbar.on{opacity:1}

  #boot{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:var(--map-bg);
    font-size:13px;color:var(--text-muted);transition:opacity .4s}
  #boot.off{opacity:0;pointer-events:none}

  @media (max-width:760px){
    #panel{width:calc(100vw - 28px);bottom:14px}
    #stats{display:none}
  }

  /* ---- 레이어 전환 ---- */
  #layerSel{display:flex;gap:3px;padding:3px;border-radius:12px;background:rgba(255,255,255,0.06)}
  #layerSel button{padding:6px 11px;font-size:12px;font-weight:600;border:0;border-radius:9px;
    background:transparent;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  #layerSel button[aria-pressed="true"]{background:var(--surface-glass);color:var(--text-primary);
    box-shadow:0 1px 6px rgba(0,0,0,.35)}

  /* ---- 바텀시트: 뷰포트 연동 리스트 ---- */
  #sheet{position:absolute;left:0;right:0;bottom:74px;z-index:6;
    border-radius:22px 22px 0 0;border-bottom:0;
    display:flex;flex-direction:column;
    height:var(--sheet-h,168px);transition:height .28s cubic-bezier(.32,.72,0,1)}
  #sheet.expanded{--sheet-h:min(74vh,620px)}
  #grab{padding:9px 0 5px;display:flex;justify-content:center;cursor:pointer;flex:none}
  #grab i{display:block;width:38px;height:4px;border-radius:99px;background:var(--text-muted);opacity:.55}
  /* ★ 폰 폭(375px)에서 제목이 **세 줄로 쪼개졌다** — `모두 / 의 / 지도`.
     정렬 버튼과 설명까지 한 줄에 밀어 넣은 탓이다.
     제목은 안 쪼개고(nowrap), 설명은 아래로 내린다. */
  #sheetHead{display:flex;align-items:baseline;gap:8px;padding:0 16px 9px;flex:none;flex-wrap:wrap}
  #sheetHead b{font-size:14.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;flex:none}
  #sheetHead span{font-size:11.5px;color:var(--text-muted);white-space:nowrap;flex:none}
  @media (max-width:430px){
    #shWhy{order:9;flex-basis:100%;margin-top:2px}
    #sheetHead b{font-size:13.5px}
  }
  #chips{display:flex;gap:6px;padding:0 16px 11px;overflow-x:auto;flex:none;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-muted);
    font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:.14s}
  .chip em{width:7px;height:7px;border-radius:99px;font-style:normal;flex:none}
  .chip[aria-pressed="true"]{color:var(--text-primary);border-color:transparent;
    background:rgba(255,255,255,0.13)}
  #list{flex:1;overflow-y:auto;padding:0 12px 16px;display:flex;flex-direction:column;gap:3px}
  #sheet:not(.expanded) #list{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:9px;padding:0 16px 14px}
  #sheet:not(.expanded) .card{flex-direction:column;width:132px;flex:none;padding:0;gap:0;background:transparent}
  #sheet:not(.expanded) .card img{width:132px;height:88px;border-radius:12px}
  #sheet:not(.expanded) .cmeta{padding:7px 2px 0}
  #sheet:not(.expanded) .cdesc{display:none}
  .card{display:flex;gap:11px;padding:8px;border-radius:13px;cursor:pointer;transition:background .14s;align-items:center}
  .card:hover{background:rgba(255,255,255,0.07)}
  .card img{width:58px;height:58px;border-radius:11px;object-fit:cover;flex:none;background:#222}
  .cmeta{min-width:0;flex:1}
  .cname{font-size:13px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cdesc{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:6px}
  .cdesc em{width:7px;height:7px;border-radius:99px;font-style:normal;flex:none}
  #empty{padding:22px 16px;font-size:12.5px;color:var(--text-muted);text-align:center;line-height:1.7}

  @media (max-width:760px){
    #panel{width:calc(100vw - 28px);bottom:auto;top:66px}
    #stats{display:none}
  }

  #devToggle{position:absolute;right:14px;top:14px;z-index:7;width:34px;height:34px;
    border-radius:11px;display:grid;place-items:center;cursor:pointer;font-size:14px;
    border:1px solid var(--surface-line);color:var(--text-muted)}
  #devToggle:hover{color:var(--text-primary)}
  #panel.hidden,#stats.hidden{display:none}
  #cov{margin-left:auto;margin-right:44px;text-align:right}

  #lensBtn{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-primary);
    font-family:inherit;font-size:14px;font-weight:650;letter-spacing:-.2px;cursor:pointer}
  #lensBtn small{display:block;font-size:10.5px;color:var(--text-muted);font-weight:500;margin-top:2px;text-align:left}
  #lensBtn b{font-weight:650}
  #lensBtn i{font-style:normal;font-size:10px;opacity:.6;margin-left:2px}
  #lensMenu{position:absolute;top:62px;left:14px;z-index:8;width:262px;padding:6px;
    border-radius:16px;display:none}
  #lensMenu.open{display:block}
  #lensMenu button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 11px;
    border:0;background:transparent;color:var(--text-primary);font-family:inherit;
    font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;text-align:left}
  #lensMenu button:hover{background:rgba(255,255,255,0.08)}
  #lensMenu button[aria-pressed="true"]{background:rgba(255,255,255,0.13)}
  #lensMenu button span{margin-left:auto;font-size:11px;color:var(--text-muted);font-weight:500}
  #lensMenu hr{border:0;border-top:1px solid var(--surface-line);margin:6px 9px}
  #lensMenu .sec{padding:5px 11px 3px;font-size:10px;letter-spacing:1px;color:var(--text-muted);font-weight:700}
  #lensMenu .new{color:var(--accent)}

  .cauthor{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;
    color:var(--accent);cursor:pointer;opacity:.9}
  .cauthor:hover{text-decoration:underline}
  #sheet:not(.expanded) .cauthor{display:none}
  #lensMenu .prof{color:var(--text-muted);font-weight:500}

  /* ---- 검색 · 기준점 ---- */
  #tools{position:absolute;left:14px;top:66px;z-index:6;display:flex;flex-direction:column;gap:8px}
  .tool{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;cursor:pointer;
    font-size:15px;border:1px solid var(--surface-line);color:var(--text-primary);position:relative}
  .tool:hover{border-color:var(--accent)}
  .tool.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  #searchWrap{position:absolute;inset:0;z-index:12;display:none;
    background:rgba(8,9,12,.55);backdrop-filter:blur(8px)}
  #searchWrap.open{display:block}
  #searchBox{position:absolute;left:14px;right:14px;top:14px;border-radius:18px;padding:12px;max-height:calc(100% - 28px);
    display:flex;flex-direction:column}
  #searchIn{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--surface-line);
    background:rgba(255,255,255,.05);color:var(--text-primary);font-family:inherit;font-size:14px;outline:none}
  #searchIn:focus{border-color:var(--accent)}
  #searchRes{margin-top:10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .sres{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:pointer}
  .sres:hover{background:rgba(255,255,255,.08)}
  .sres img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none;background:#222}
  .sres .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;
    background:rgba(255,255,255,.07);font-size:14px}
  .sres b{font-size:13px;font-weight:650;display:block}
  .sres small{font-size:11px;color:var(--text-muted)}
  .sres .anch{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent);
    border:1px solid var(--accent);border-radius:9px;padding:5px 9px;white-space:nowrap}
  #searchHint{padding:14px 10px;font-size:12px;color:var(--text-muted);line-height:1.8}

  #anchorBar{position:absolute;left:14px;right:14px;top:66px;z-index:6;padding:9px 12px;
    border-radius:14px;display:none;align-items:center;gap:9px;font-size:12.5px}
  #anchorBar.on{display:flex}
  #anchorBar b{font-weight:650}
  #anchorBar .rad{margin-left:auto;display:flex;gap:4px}
  #anchorBar .rad button{padding:5px 9px;border-radius:9px;font-size:11px;font-weight:600;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-muted);cursor:pointer;font-family:inherit}
  #anchorBar .rad button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  #anchorBar .x{cursor:pointer;color:var(--text-muted);font-size:15px;padding:0 2px}

  #sortSeg{display:flex;gap:4px;margin-left:auto;flex:none !important}
  #sortSeg button{flex:none !important}
  #sortSeg button{padding:5px 10px;border-radius:9px;font-size:11px;font-weight:600;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-muted);cursor:pointer;font-family:inherit}
  #sortSeg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--text-primary);border-color:transparent}
  .cdist{color:var(--accent);font-weight:700}

  /* ══════ 업로드 플로우 ══════ */
  #fab{position:absolute;right:16px;bottom:250px;z-index:7;width:54px;height:54px;border-radius:50%;
    border:0;background:var(--accent);color:var(--on-accent);font-size:28px;font-weight:300;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.45);display:grid;place-items:center;font-family:inherit}
  #fab:hover{filter:brightness(1.08)}
  #fabBadge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:99px;
    background:#fff;color:var(--accent);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}

  #upWrap{position:absolute;inset:0;z-index:14;background:rgba(6,7,10,.6);backdrop-filter:blur(10px);
    display:flex;align-items:flex-end;justify-content:center}
  #upSheet{width:min(560px,100%);max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;
    overflow:hidden;animation:upIn .26s cubic-bezier(.32,.72,0,1)}
  @keyframes upIn{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .upHead{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;flex:none}
  .upHead b{font-size:16px;font-weight:700;letter-spacing:-.3px;flex:1;text-align:center}
  .upX,.upBack{cursor:pointer;color:var(--text-muted);font-size:18px;width:24px;text-align:center}
  .upBack{font-size:24px}
  .upNote{padding:0 18px 12px;font-size:12px;color:var(--text-muted);line-height:1.65;flex:none}
  .upNote b{color:var(--text-primary);font-weight:650}
  .upCta{margin:12px 16px 18px;padding:14px;border:0;border-radius:14px;background:var(--accent);
    color:var(--on-accent);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;flex:none}

  .entryList{padding:0 12px 16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
  .entry{display:flex;align-items:center;gap:13px;padding:14px;border-radius:14px;cursor:pointer;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-primary);
    font-family:inherit;text-align:left;transition:.14s}
  .entry:hover{background:rgba(255,255,255,.07);border-color:var(--accent)}
  .entry i{font-style:normal;font-size:22px;width:30px;text-align:center}
  .entry b{display:block;font-size:14px;font-weight:650;margin-bottom:3px}
  .entry small{font-size:11.5px;color:var(--text-muted);line-height:1.5}
  .entry em{margin-left:auto;font-style:normal;color:var(--text-muted);font-size:18px}

  .tripList{padding:0 12px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .tripRow{display:flex;align-items:center;gap:12px;padding:9px;border-radius:13px;cursor:pointer;
    border:0;background:transparent;color:var(--text-primary);font-family:inherit;text-align:left}
  .tripRow:hover{background:rgba(255,255,255,.07)}
  .tripRow img{width:54px;height:54px;border-radius:11px;object-fit:cover;flex:none;background:#222}
  .tripRow b{display:block;font-size:14px;font-weight:650}
  .tripRow small{font-size:11.5px;color:var(--text-muted);display:block;margin-top:3px}
  .tripRow em{margin-left:auto;font-style:normal;color:var(--text-muted);font-size:18px}

  .pgList{overflow-y:auto;padding:0 16px 8px;flex:1}
  .pg{margin-bottom:18px}
  .pgHead b{font-size:13.5px;font-weight:650}
  .pgHead small{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);margin-top:3px}
  .pgHead small em{width:7px;height:7px;border-radius:99px;font-style:normal}
  .pgRow{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
  .pgRow::-webkit-scrollbar{display:none}
  .pgPhoto{position:relative;width:76px;height:76px;border-radius:11px;overflow:hidden;flex:none;
    border:2px solid transparent;background:none;padding:0;cursor:pointer}
  .pgPhoto img{width:100%;height:100%;object-fit:cover;opacity:.45;transition:.15s}
  .pgPhoto .chk{position:absolute;right:4px;top:4px;width:19px;height:19px;border-radius:99px;
    background:rgba(0,0,0,.5);color:transparent;font-size:11px;display:grid;place-items:center;font-weight:800}
  .pgPhoto.on{border-color:var(--accent)}
  .pgPhoto.on img{opacity:1}
  .pgPhoto.on .chk{background:var(--accent);color:var(--on-accent)}

  .fm{padding:0 18px 8px;overflow-y:auto;flex:1}
  .fm label{display:block;font-size:11px;color:var(--text-muted);margin:14px 0 6px;letter-spacing:.2px}
  .fm label .opt{color:var(--accent);margin-left:5px}
  .fm input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--surface-line);
    background:rgba(255,255,255,.05);color:var(--text-primary);font-family:inherit;font-size:14px;outline:none}
  .fm input:focus{border-color:var(--accent)}
  .fmHint{font-size:11px;color:var(--text-muted);margin-top:7px;line-height:1.6}
  .fmHint b{color:var(--text-primary)}
  .vis{display:flex;gap:6px;flex-wrap:wrap}
  .vb{padding:10px 14px;border-radius:12px;font-size:12.5px;font-weight:600;cursor:pointer;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-muted);font-family:inherit}
  .vb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .fmSum{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px;padding:14px;
    border-radius:13px;background:rgba(255,255,255,.05)}
  .fmSum div{display:flex;justify-content:space-between;font-size:12px}
  .fmSum i{font-style:normal;color:var(--text-muted)}
  .fmSum b{font-weight:650}

  .pfInput{margin:0 16px;width:calc(100% - 32px);padding:12px 13px;border-radius:12px;
    border:1px solid var(--surface-line);background:rgba(255,255,255,.05);color:var(--text-primary);
    font-family:inherit;font-size:14px;outline:none}
  .pfInput:focus{border-color:var(--accent)}
  .pfRes{overflow-y:auto;padding:10px 12px 16px;flex:1}
  .pfRow{display:flex;align-items:center;gap:11px;padding:9px;border-radius:12px}
  .pfRow:hover{background:rgba(255,255,255,.07)}
  .pfRow img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;background:#222}
  .pfRow b{display:block;font-size:13px;font-weight:650}
  .pfRow small{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);margin-top:3px}
  .pfRow small em{width:7px;height:7px;border-radius:99px;font-style:normal}
  .pfAdd{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent);
    border:1px solid var(--accent);border-radius:10px;padding:7px 11px;cursor:pointer;white-space:nowrap}

  .liveBox{padding:8px 24px 28px;text-align:center}
  .liveCam{font-size:46px;margin-bottom:14px}
  .liveBox b{font-size:15px;font-weight:700}
  .liveBox p{font-size:12.5px;color:var(--text-muted);line-height:1.75;margin:10px 0 0}
  .liveBox p b{color:var(--text-primary)}
  .liveWhy{margin-top:16px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);
    font-size:11.5px;color:var(--text-muted);line-height:1.6}

  #upToast{position:absolute;left:50%;bottom:30px;transform:translate(-50%,16px);z-index:15;
    padding:13px 20px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;transition:.28s;pointer-events:none}
  #upToast.on{opacity:1;transform:translate(-50%,0)}

  /* 사진 역할 구분 — 대표 / 노출 / 저장 */
  .pgCell{position:relative;flex:none}
  .pgPhoto .tag{position:absolute;left:4px;bottom:4px;padding:2px 6px;border-radius:7px;
    font-size:9.5px;font-weight:800;letter-spacing:.2px;background:rgba(0,0,0,.6);color:#fff}
  .pgPhoto .tag.add{left:auto;right:4px;bottom:auto;top:4px;width:18px;height:18px;padding:0;
    display:grid;place-items:center;font-size:13px;font-weight:400;border-radius:99px}
  .pgPhoto.r-main{border-color:var(--accent)}
  .pgPhoto.r-main .tag{background:var(--accent);color:var(--on-accent)}
  .pgPhoto.r-show{border-color:rgba(255,255,255,.55)}
  .pgPhoto.r-show .tag{background:rgba(255,255,255,.9);color:#14161C}
  .pgPhoto.r-keep{border-color:rgba(255,255,255,.18)}
  .pgPhoto.r-keep img{opacity:.7}
  .pgPhoto.r-keep .tag{background:rgba(255,255,255,.22)}
  .mainBtn{position:absolute;right:3px;top:3px;width:21px;height:21px;border-radius:99px;border:0;
    background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer;line-height:1;padding:0;
    display:grid;place-items:center}
  .mainBtn:hover{background:var(--accent)}
  .lg-main{color:var(--accent)} .lg-show{color:var(--text-primary)} .lg-keep{color:var(--text-muted)}
  .sb{padding:10px 14px;border-radius:12px;font-size:12.5px;font-weight:600;cursor:pointer;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-muted);font-family:inherit}
  .sb.on{background:rgba(255,255,255,.16);border-color:transparent;color:var(--text-primary)}

  /* ══════ 탭바 · 스페이스 · 마이 ══════ */
  #tabbar{position:absolute;left:14px;right:14px;bottom:14px;z-index:9;display:flex;
    padding:6px;border-radius:18px;gap:4px}
  #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;
    border:0;border-radius:13px;background:transparent;color:var(--text-muted);cursor:pointer;
    font-family:inherit;font-size:16px}
  #tabbar button span{font-size:10.5px;font-weight:600}
  #tabbar button[aria-pressed="true"]{background:rgba(255,255,255,.13);color:var(--text-primary)}

  #spPanel{position:absolute;left:0;right:0;top:0;bottom:0;z-index:8;display:none;
    border-radius:0;overflow-y:auto;padding:58px 14px 100px}
  #spPanel.on{display:block}

  /* 탭2 갈 곳 — 카드 단위는 사진이 아니라 장소다 (§12.10) */
  #fdPanel{position:absolute;left:0;right:0;top:0;bottom:0;z-index:8;display:none;
    border-radius:0;overflow-y:auto;padding:58px 0 100px}
  #fdPanel.on{display:block}

  /* 탭3 소식 — 페이스북형 홈이되 팔로우 그래프는 없다 (§12.21) */
  #hmPanel{position:absolute;left:0;right:0;top:0;bottom:0;z-index:8;display:none;
    border-radius:0;overflow-y:auto;padding:58px 0 100px}
  #hmPanel.on{display:block}

  /* 탭5 마이 — 금고와 리포트 (원본 기획서 §6 탭5) */
  #myPanel{position:absolute;left:0;right:0;top:0;bottom:0;z-index:8;display:none;
    border-radius:0;overflow-y:auto;padding:58px 18px 100px}
  #myPanel.on{display:block}

  /* 정거장 한 줄 — 여행 한 줄(fNote)과 다르다. 뷰어가 읽던 memo 를 여기서 쓴다 */
  .pgMemo{display:block;width:100%;margin-top:9px;padding:10px 12px;border-radius:12px;
    font-family:inherit;font-size:12.5px;border:1px solid var(--surface-line);
    background:rgba(255,255,255,.04);color:var(--text-primary)}
  .pgMemo::placeholder{color:var(--text-muted)}
  .pgMemo:focus{outline:0;border-color:var(--accent)}
  .inferNote{margin-top:8px;padding:9px 11px;border-radius:11px;font-size:11.5px;line-height:1.6;
    border:1px dashed var(--surface-line);color:var(--text-muted)}
  .inferNote b{color:var(--text-primary)}
  .inferNote small{display:block;font-size:10.5px;margin-top:3px;opacity:.85}
  /* 시트 카드의 현장 인증 — 뷰어에만 있고 가장 많이 보는 화면엔 없었다 */
  .cver{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:99px;
    font-size:9.5px;font-weight:700;border:1px solid var(--surface-line);color:var(--text-muted)}
  .cver.live{border-color:var(--accent);color:var(--accent)}
  /* 스페이스 안 댓글 — 공개 기록에는 안 붙는다 (§12.6 수정) */
  .vwNoC{margin:10px 0 0;font-size:11px;color:var(--text-muted);line-height:1.6}
  .vwNoC small{display:block;font-size:10.5px;opacity:.8;margin-top:2px}
  .vwC{margin-top:11px;padding:11px 12px;border-radius:13px;
    border:1px solid var(--surface-line);background:rgba(255,255,255,.04)}
  .vwCHead{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
    color:var(--accent);margin-bottom:8px}
  .vwCHead em{font-style:normal;padding:1px 6px;border-radius:99px;font-size:9.5px;
    background:var(--accent);color:var(--on-accent)}
  .vwCRow{display:flex;gap:7px;font-size:12px;line-height:1.6;margin-bottom:5px}
  .vwCRow b{flex:none;font-weight:650;color:var(--text-primary)}
  .vwCRow span{color:var(--text-muted);word-break:break-word}
  .vwCNew{display:flex;gap:6px;margin-top:9px}
  .vwCIn{flex:1;min-width:0;padding:8px 11px;border-radius:99px;font-family:inherit;font-size:12px;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-primary)}
  .vwCIn::placeholder{color:var(--text-muted)}
  .vwCIn:focus{outline:0;border-color:var(--accent)}
  /* 보내지 못한 댓글 — 조용히 사라지는 것이 가장 나쁘다 */
  .vwCRow.vwCFail span{opacity:.55}
  .vwCRow.vwCFail i{font-style:normal;margin-left:6px;font-size:9.5px;font-weight:700;
    padding:1px 6px;border-radius:99px;background:rgba(224,169,74,.18);color:#e0a94a;cursor:help}
  .vwCGo{flex:none;padding:8px 13px;border-radius:99px;border:0;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent)}
  #shWhy{flex-basis:100%;order:9;font-size:10.5px;color:var(--text-muted);margin-top:3px}
  /* 출처 배지 — 한 핀에 하나. 남의 것에는 안 붙인다(기본값이라 붙이면 소음이 된다) */
  #invWrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);padding:20px}
  #invCard{max-width:340px;width:100%;padding:22px;border-radius:18px;text-align:center}
  .invHead{font-size:11.5px;color:var(--text-muted);font-weight:600}
  .invTitle{display:block;font-size:19px;margin:8px 0 4px}
  .invSub{font-size:12.5px;color:var(--text-muted)}
  .invGo{margin-top:16px;width:100%;padding:13px;border:0;border-radius:13px;cursor:pointer;
    background:var(--accent);color:var(--on-accent);font-family:inherit;font-size:14.5px;font-weight:700}
  .invNote{margin-top:10px;font-size:11px;color:var(--text-muted);line-height:1.55}
  .csrc{margin-left:5px;padding:1px 5px;border-radius:99px;font-size:9.5px;font-weight:700}
  .csrc-mine{background:rgba(56,182,255,.18);color:var(--accent)}
  .csrc-shared{background:rgba(127,168,196,.18);color:#7FA8C4}
  /* 신뢰 필터 — 사진 수가 아니라 **사람 수**로 자른다 (§13.10) */
  #scopes{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
  #scopes::-webkit-scrollbar{display:none}
  /* ★ `.tchip` 을 빌려 쓰지 않는다. 그 클래스는 **개수(<i>)가 붙는다는 약속**을 달고 있고,
     빌리면 그 약속이 조용히 깨진다 (uismoke 가 잡았다 — §13.28 "클래스는 스타일이다"). */
  .schip{flex:none;padding:6px 11px;border-radius:99px;cursor:pointer;font-family:inherit;
    font-size:11.5px;font-weight:600;white-space:nowrap;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-muted)}
  .schip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  #trust{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
  #trust::-webkit-scrollbar{display:none}
  .tchip{flex:none;display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;
    cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:600;white-space:nowrap;
    border:1px solid var(--surface-line);background:transparent;color:var(--text-muted)}
  .tchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
  .tchip i{font-style:normal;font-size:10px;opacity:.75;font-weight:700}
  .cnu{color:var(--accent);font-weight:700}
  /* 지금 무엇을 보고 있는지 한 줄 — 단위가 바뀐 것을 모르면 '핀이 사라졌다'고 느낀다 */
  #zoomHint{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:6;
    padding:6px 12px;border-radius:99px;font-size:11px;font-weight:600;
    color:var(--text-muted);opacity:0;transition:opacity .2s;pointer-events:none}
  #zoomHint.on{opacity:1}
  /* 검색 결과가 어디서 왔는지 — 모르면 디버깅이 추측이 된다 */
  .sVia{padding:6px 12px;font-size:10.5px;font-weight:700;color:var(--accent)}
  .sVia.off{color:var(--text-muted);font-weight:500}
  .ckVia{display:block;margin-top:5px;font-size:10.5px;font-weight:600;color:var(--text-muted)}
  .ckVia.on{color:var(--accent)}
  /* 지역 스코프 바 — 말없이 목록만 줄면 데이터가 없는 줄 안다 */
  #regionBar{position:absolute;left:14px;right:14px;top:66px;z-index:6;display:none;
    align-items:center;gap:6px;padding:9px 12px;border-radius:13px;font-size:12.5px}
  #regionBar.on{display:flex}
  #regionBar b{font-weight:700;color:var(--accent)}
  #regionBar span{color:var(--text-muted)}
  #regionBar .x{margin-left:auto;cursor:pointer;color:var(--text-muted);font-size:15px;padding:0 2px}
  .myTop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .myAv2{width:46px;height:46px;border-radius:99px;background:var(--accent);color:var(--on-accent);
    font-size:18px;font-weight:700;display:grid;place-items:center;flex:none}
  .myWho b{display:block;font-size:16px;font-weight:700}
  .myWho small{display:block;font-size:11.5px;color:var(--text-muted);margin-top:2px}
  .myEdit{margin-left:auto;padding:7px 12px;border-radius:99px;cursor:pointer;font-family:inherit;
    font-size:11.5px;font-weight:600;border:1px solid var(--surface-line);
    background:transparent;color:var(--text-muted);white-space:nowrap;flex:none}

  .myCard{padding:16px;border-radius:18px;border:1px solid var(--surface-line);
    background:rgba(255,255,255,.03)}
  .myPctRow{display:flex;align-items:flex-end;gap:10px}
  .myPctRow i{display:block;font-style:normal;font-size:11.5px;color:var(--text-muted)}
  .myPctRow b{display:block;font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1.05}
  .myPctSub{margin-left:auto;font-size:12px;color:var(--text-muted);padding-bottom:4px}
  .myBar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);margin:12px 0 14px;overflow:hidden}
  .myBar span{display:block;height:100%;background:var(--accent);border-radius:99px}
  .myMini{display:flex;gap:8px}
  .myMini div{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:rgba(255,255,255,.04)}
  .myMini i{display:block;font-style:normal;font-size:10.5px;color:var(--text-muted)}
  .myMini b{display:block;font-size:16px;font-weight:700;margin-top:3px}
  .myShare{width:100%;margin-top:12px;padding:12px;border-radius:13px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;color:var(--on-accent);border:0;background:var(--accent)}
  .myShare span{display:block;font-size:10.5px;font-weight:500;opacity:.85;margin-top:3px}

  .myNote2{margin-top:14px;padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.04);
    font-size:12px;line-height:1.7;color:var(--text-muted)}
  .myNote2 b{color:var(--text-primary)}
  .myNote2 em{display:block;font-style:normal;margin-top:6px;font-size:11px;opacity:.85}

  .mySec{margin:26px 0 10px;font-size:15px;font-weight:700;letter-spacing:-.3px}
  .mySec small{display:block;font-size:11px;font-weight:500;color:var(--text-muted);margin-top:4px}
  .mySec small b{color:var(--text-primary);font-weight:650}

  .mySidoRow{display:flex;align-items:center;gap:10px;padding:9px 2px;cursor:pointer}
  .mySidoRow b{font-size:12.5px;font-weight:600;width:88px;flex:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mySidoBar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .mySidoBar span{display:block;height:100%;background:var(--accent)}
  .mySidoRow em{font-style:normal;font-size:11px;color:var(--text-muted);width:58px;
    text-align:right;flex:none}
  /* 스페이스 = 함께 채운 지도 (§13.16) */
  .spMap{margin:2px 0 12px;padding:14px;border-radius:16px;
    border:1px solid var(--surface-line);background:rgba(255,255,255,.03)}
  .spMapTop{display:flex;align-items:flex-end;gap:8px}
  .spMapTop i{display:block;font-style:normal;font-size:11px;color:var(--text-muted)}
  .spMapTop b{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.05}
  .spMapTop span{font-size:11.5px;color:var(--text-muted);margin-left:5px}
  .spMapTop em{margin-left:auto;font-style:normal;font-size:13px;font-weight:700;color:var(--accent)}
  .spBar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin:11px 0 12px;overflow:hidden}
  .spBar span{display:block;height:100%;background:var(--accent)}
  .spSplit{display:flex;gap:8px;margin-bottom:12px}
  .spSplit div{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:rgba(255,255,255,.04)}
  .spSplit b{display:block;font-size:17px;font-weight:700}
  .spSplit small{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px}
  .spWhoRow{display:flex;align-items:center;gap:8px;padding:5px 0}
  .spWhoRow i{width:22px;height:22px;border-radius:99px;background:var(--accent);color:var(--on-accent);
    font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}
  .spWhoRow span{font-size:12px;width:52px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spWhoBar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .spWhoBar span{display:block;width:auto;height:100%;background:var(--accent);opacity:.8}
  .spWhoRow em{font-style:normal;font-size:11px;color:var(--text-muted);width:38px;text-align:right;flex:none}
  .spOpenMap{width:100%;margin-top:12px;padding:12px;border-radius:13px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;color:var(--on-accent);border:0;background:var(--accent)}
  .spEmptyMap{margin:2px 0 12px;padding:22px 14px;border-radius:16px;text-align:center;
    font-size:13px;font-weight:600;border:1px dashed var(--surface-line);color:var(--text-primary)}
  .spEmptyMap small{display:block;font-size:11.5px;font-weight:500;color:var(--text-muted);margin-top:6px}

  /* 계정 — 익명은 기기에 묶인다. 그 사실을 화면이 말한다 (§13.19) */
  .myAcctBtn{width:100%;padding:14px;border-radius:14px;cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:700;color:var(--on-accent);border:0;background:var(--accent)}
  .myAcctBtn span{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:4px}
  .myAcctRow{display:flex;align-items:center;gap:8px;padding:12px;border-radius:13px;
    border:1px solid var(--surface-line)}
  .myAcctRow b{font-size:13px;font-weight:650}
  .myAcctRow code{font-size:11px;color:var(--text-muted);font-family:ui-monospace,monospace}
  .myAcctRow em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:700;
    padding:2px 8px;border-radius:99px;background:rgba(224,169,74,.15);color:#e0a94a}
  .myAcctRow.off{display:block;color:var(--text-muted);font-size:12.5px}
  .myAcctRow.off small{display:block;font-size:11px;margin-top:3px}
  /* 사진 올리기 — 줄인 결과를 숫자로 보여준다 (§13.22) */
  .myServer:not(:empty){margin-bottom:8px;padding:11px 12px;border-radius:13px;
    border:1px solid var(--surface-line);font-size:11.5px;color:var(--text-muted)}
  .mySrvRow{display:flex;align-items:baseline;gap:8px}
  .mySrvRow b{font-size:12.5px;color:var(--text-primary)}
  .mySrvRow em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--accent);font-weight:700}
  .myServer small{display:block;margin-top:4px;font-size:10.5px}
  .myUp{margin-top:8px}
  .myUpBtn{display:block;width:100%;padding:13px;border-radius:13px;cursor:pointer;text-align:center;
    font-size:13px;font-weight:700;color:var(--accent);border:1px dashed var(--surface-line)}
  .myUpBtn span{display:block;font-size:10.5px;font-weight:500;color:var(--text-muted);margin-top:4px}
  /* 다른 기기에서 보기 (§13.39) — 두 방향을 눈으로도 가른다 */
  .myDev{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .myDevSec{padding:13px;border-radius:13px;border:1px solid var(--surface-line)}
  .myDevSec b{font-size:13px}
  .myDevSec small{display:block;margin-top:3px;font-size:11px;color:var(--text-muted);line-height:1.5}
  .myDevRow{display:flex;gap:6px;margin-top:9px}
  .myDevRow input{flex:1;min-width:0;padding:9px 11px;border-radius:10px;font-family:inherit;
    font-size:12.5px;border:1px solid var(--surface-line);background:rgba(255,255,255,.04);color:var(--text)}
  .myDevBtn{flex:none;padding:9px 12px;border:0;border-radius:10px;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:700;background:var(--accent);color:var(--on-accent)}
  .myDevOut{margin-top:8px;font-size:11px;color:var(--text-muted);line-height:1.5}
  .myDevOut.bad{color:var(--warn,#e0a94a)}
  .myUpOut{margin-top:8px;font-size:12px;color:var(--text-muted)}

  .ocrEnter{width:100%;margin:10px 0 2px;padding:11px;border-radius:12px;font-size:12.5px;
    font-weight:650;cursor:pointer;font-family:inherit;text-align:left;

  .ocrEnter small{display:block;font-size:11px;font-weight:500;color:var(--text-muted);margin-top:3px}
  .ocrDict{padding:9px 11px;border-radius:11px;margin:2px 0 9px;font-size:12px;
    border:1px solid var(--accent,#7aa2f7);background:rgba(122,162,247,.10)}
  .ocrDict.off{border-color:var(--surface-line);background:rgba(255,255,255,.03)}
  .ocrDict small{display:block;font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.6}
  .ocrList{display:flex;flex-direction:column;gap:6px;margin:2px 0 10px}
  .ocrLine{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
    border:1px solid var(--surface-line)}
  .ocrLine.hit{border-color:var(--accent,#7aa2f7);background:rgba(122,162,247,.10)}
  .ocrLine.out,.ocrLine.none,.ocrLine.broad{opacity:.55}
  .ocrT{font-weight:650;line-height:1.2;flex:none;max-width:45%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .ocrWhy{font-size:11px;color:var(--text-muted);flex:1}
  .ocrX{font-size:11px;color:var(--text-muted);flex:none}
  .ocrGo{flex:none;padding:7px 11px;border-radius:9px;font-size:11.5px;font-weight:650;
    cursor:pointer;font-family:inherit;border:0;background:var(--accent,#7aa2f7);color:#0b1020}
  .ocrFoot{font-size:11.5px;color:var(--text-muted);line-height:1.6;padding:10px 11px;
    border-radius:11px;border:1px dashed var(--surface-line)}
  /* 사진 뷰어 (§12.2) */
  .vwYears{display:flex;gap:6px;overflow-x:auto;padding:2px 0 9px;flex:none}
  .vwYear{flex:none;padding:6px 11px;border-radius:99px;font-size:11.5px;font-weight:650;
    cursor:pointer;font-family:inherit;border:1px solid var(--surface-line);
    background:transparent;color:var(--text-muted)}
  .vwYear.on{border-color:var(--accent,#7aa2f7);color:var(--accent,#7aa2f7);
    background:rgba(122,162,247,.12)}
  .vwScroll{height:62vh;overflow-y:auto;scroll-snap-type:y mandatory;
    border-radius:14px;background:rgba(0,0,0,.25)}
  .vwPane{height:62vh;scroll-snap-align:start;display:flex;flex-direction:column}
  .vwImg{flex:1;min-height:0;background:#000;display:grid;place-items:center;overflow:hidden}
  .vwImg img{width:100%;height:100%;display:block}
  .vwMeta{flex:none;padding:10px 13px 12px}
  .vwWho{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .vwWho b{font-weight:650}
  .vwWho time{color:var(--text-muted);font-size:11.5px}
  .vwBadge{margin-left:auto;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:650;
    border:1px solid var(--surface-line);color:var(--text-muted);cursor:help}
  .vwBadge.live{border-color:var(--accent,#7aa2f7);color:var(--accent,#7aa2f7)}
  .vwMemo{margin:7px 0 0;font-size:12.5px;line-height:1.6}
  .vwWarn{margin:6px 0 0;font-size:11px;color:var(--warn,#c98a6e)}
  .vwNav{margin-top:7px;font-size:10.5px;color:var(--text-muted)}
  .vwEnd{height:62vh;scroll-snap-align:start;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:9px;padding:0 24px;text-align:center}

  .vwEnd small{font-size:11.5px;color:var(--text-muted);line-height:1.6}
  .vwNext{margin-top:6px;padding:10px 16px;border-radius:11px;font-size:12.5px;font-weight:650;
    cursor:pointer;font-family:inherit;border:0;background:var(--accent,#7aa2f7);color:#0b1020}
  /* 운영자 신고함 (§10.45) */
  .opsCard{padding:11px 12px;border-radius:13px;margin-bottom:9px;
    border:1px solid var(--surface-line);background:rgba(255,255,255,.03)}
  .opsTop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .opsTop small{margin-left:auto;font-size:11px;color:var(--text-muted)}
  .opsTag{padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:650;
    border:1px solid var(--surface-line);color:var(--text-muted)}

  .opsReason{font-size:12.5px;font-weight:600;margin:7px 0 6px}
  .opsEv{font-size:11.5px;line-height:1.75;color:var(--text-muted);
    padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.04)}
  .opsEv i{font-style:normal;display:inline-block;min-width:34px;opacity:.7}

  .opsAct{display:flex;gap:7px;margin-top:9px}
  .opsBtn{flex:1;padding:8px;border-radius:9px;font-size:12px;font-weight:650;cursor:pointer;
    font-family:inherit;border:1px solid var(--surface-line);background:transparent;color:var(--text)}
  .opsBtn.ok:hover{border-color:var(--accent,#7aa2f7);color:var(--accent,#7aa2f7)}
  .opsBtn.no:hover{border-color:var(--warn,#c98a6e);color:var(--warn,#c98a6e)}
  .opsDone{font-size:11.5px;color:var(--text-muted);padding:9px 11px;border-radius:11px;
    border:1px dashed var(--surface-line);line-height:1.7}

  .opsHist em{font-style:normal;color:var(--text);font-weight:600}
  .opsCard.closed{opacity:.85;background:transparent}
  .opsTag.ok{border-color:var(--accent,#7aa2f7);color:var(--accent,#7aa2f7)}

  .opsPerson small{margin-left:auto;font-size:10.5px;color:var(--text-muted);text-align:right}
  .opsPerson .opsBtn{flex:none;padding:5px 10px;font-size:11px;margin-left:8px}
  .opsPerson .opsBtn[disabled]{opacity:.35;cursor:default}
  .opsAddRow{display:flex;gap:7px;margin-top:9px;align-items:center}
  .opsAddRow .opsBtn{flex:none;padding:9px 14px}
  .opsLog{margin-top:10px;padding-top:9px;border-top:1px solid var(--surface-line);font-size:11px}
  .opsLog b{display:block;font-size:11.5px;margin-bottom:4px}
  .opsLog small{display:block;color:var(--text-muted);line-height:1.7}
  .opsLog em{font-style:normal;color:var(--text)}
  .opsLogWhy{margin-top:5px;opacity:.75}
  /* 신고 (§10.43) */
  .rpEnter{margin:2px 14px 10px;padding:9px 11px;border-radius:11px;font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;text-align:left;width:calc(100% - 28px);
    border:1px dashed var(--surface-line);background:transparent;color:var(--text-muted)}
  .rpEnter:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .rpFlag{flex:none;padding:3px 7px;border-radius:7px;font-size:11px;cursor:pointer;
    font-family:inherit;border:1px solid var(--surface-line);background:transparent;

  .rpList{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
  .rpRow{padding:10px 12px;border-radius:11px;text-align:left;cursor:pointer;font-family:inherit;
    border:1px solid var(--surface-line);background:rgba(255,255,255,.05);color:var(--text)}
  .rpRow:hover{background:rgba(255,255,255,.11)}
  .rpRow b{display:block;font-size:13px;font-weight:650}
  .rpRow small{display:block;font-size:11px;color:var(--text-muted);margin-top:3px}
  .rpKnown,.rpDone{padding:10px 12px;border-radius:11px;margin-bottom:9px;font-size:12.5px;
    border:1px solid var(--accent,#7aa2f7);background:rgba(122,162,247,.10)}
  .rpDone{border-color:var(--surface-line);background:rgba(255,255,255,.04)}
  .rpKnown small,.rpDone small{display:block;font-size:11px;color:var(--text-muted);
    margin-top:4px;line-height:1.55}
  .rpFoot{font-size:11.5px;color:var(--text-muted);line-height:1.6;padding:10px 11px;
    border-radius:11px;border:1px dashed var(--surface-line)}
  .rpWrote{padding:9px 11px;border-radius:11px;margin:9px 0;font-size:12px;
    border:1px solid var(--surface-line);background:rgba(255,255,255,.03)}
  .rpWrote small{display:block;font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.6}
  .rpWrote code{font-family:ui-monospace,monospace;font-size:10.5px}
  .upInput{width:100%;padding:10px 12px;border-radius:11px;font-size:13px;font-family:inherit;
    border:1px solid var(--surface-line);background:rgba(255,255,255,.05);color:var(--text);
    margin-bottom:8px}
  .rgAll{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-muted);
    margin-bottom:9px;cursor:pointer}
  .rgList{display:flex;flex-wrap:wrap;gap:6px;max-height:46vh;overflow:auto}
  .rgRow{padding:7px 11px;border-radius:9px;font-size:12px;cursor:pointer;text-align:left;
    font-family:inherit;border:1px solid var(--surface-line);background:rgba(255,255,255,.05);
    color:var(--text)}
  .rgRow b{display:block;font-weight:650}
  .rgRow small{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px}
  /* 사전이 이미 준비된 지역 — 고르면 바로 기기에서 조회된다 */
  .rgRow.ready{border-color:var(--accent,#7aa2f7)}
  .rgRow.ready b::after{content:" ●";color:var(--accent,#7aa2f7);font-size:9px;vertical-align:middle}
  .rgRow:hover{background:rgba(255,255,255,.11)}
  .ocrDict code{font-family:ui-monospace,monospace;font-size:10.5px;opacity:.8}
  .tripDemote{width:100%;margin-top:10px;padding:10px;border-radius:11px;font-size:12px;
    font-weight:600;cursor:pointer;font-family:inherit;border:1px dashed var(--surface-line);
    background:transparent;color:var(--text-muted)}
  .tripDemote:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .orRow img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none;background:#222}
  .orRow b{display:block;font-size:12.5px;font-weight:600}
  .orRow small{display:block;font-size:11px;color:var(--text-muted);margin-top:2px}
  .orFar{font-style:normal;color:var(--accent);font-weight:700}
  .orMore{font-size:11px;color:var(--text-muted);padding:5px 0 0 48px}
  .orCta{width:100%;margin-top:11px;padding:11px;border-radius:12px;cursor:pointer;
    border:1px solid var(--accent);background:transparent;color:var(--accent);
    font-family:inherit;font-size:12.5px;font-weight:700}
  .fm code{font-family:ui-monospace,monospace;font-size:11px;background:rgba(255,255,255,.1);
    padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div id="map"></div>

<div id="header" class="glass">
  <button id="lensBtn"><span><b id="lensName">모두의 지도</b><small id="lensSub">전체 공개된 기록</small></span><i>▼</i></button>
  <div id="cov"><b id="covPct">0.0%</b><span id="covCnt">0 / 250</span></div>
</div>

<div id="tools">
  <div class="tool glass" id="btnSearch" title="검색">🔍</div>
  <div class="tool glass" id="btnGps" title="내 위치를 기준점으로">📍</div>
</div>

<div id="anchorBar" class="glass">
  <span>기준</span><b id="anchorName">—</b>
  <span class="rad" id="radSeg">
    <button data-v="0" aria-pressed="true">전체</button>
    <button data-v="500">500m</button>
    <button data-v="1000">1km</button>
    <button data-v="3000">3km</button>
  </span>
  <span class="x" id="anchorClear">✕</span>
</div>

<div id="searchWrap">
  <div id="searchBox" class="glass">
    <input id="searchIn" placeholder="지역 · 장소 검색   (예: 해운대, 광안리, 카페)" autocomplete="off">
    <div id="searchRes"></div>
  </div>
</div>

<div id="lensMenu" class="glass"></div>
<div id="devToggle" class="glass" title="개발 패널">⚙</div>
<div id="fpsbar" class="glass"><span id="fpsLive">—</span></div>

<div id="panel" class="glass">
  <div class="row">
    <div class="lab">렌더 방식</div>
    <div class="seg" id="segMode">
      <button data-v="atlas" aria-pressed="true">아틀라스</button>
      <button data-v="perRegion">개별</button>
      <button data-v="flat">단색</button>
    </div>
  </div>
  <div class="row">
    <div class="lab">방문 지역</div>
    <div class="seg" id="segCount">
      <button data-v="20">20</button>
      <button data-v="90" aria-pressed="true">90</button>
      <button data-v="250">250</button>
    </div>
  </div>
  <div class="row">
    <div class="lab">테마</div>
    <div class="seg" id="segTheme">
      <button data-v="dark" aria-pressed="true">다크</button>
      <button data-v="light">라이트</button>
    </div>
  </div>
  <div class="row">
    <div class="lab">육지 대비</div>
    <div class="seg" id="segContrast">
      <button data-v="low">약</button>
      <button data-v="mid">중</button>
      <button data-v="high" aria-pressed="true">강</button>
    </div>
  </div>
  <div class="row">
    <div class="lab">폴리곤 분할</div>
    <div class="seg" id="segMosaic">
      <button data-v="on">켬</button>
      <button data-v="off" aria-pressed="true">끔</button>
    </div>
  </div>
  <div class="row">
    <div class="lab">장소 핀</div>
    <div class="seg" id="segPins">
      <button data-v="on" aria-pressed="true">켬</button>
      <button data-v="off">끔</button>
    </div>
  </div>
  <div class="row">
    <div class="lab">다양성 쿼터</div>
    <div class="seg" id="segQuota">
      <button data-v="on" aria-pressed="true">켬</button>
      <button data-v="off">끔</button>
    </div>
  </div>
  <div class="row">
    <div class="lab">톤 보정</div>
    <div class="seg" id="segVeil">
      <button data-v="on" aria-pressed="true">켬</button>
      <button data-v="off">끔</button>
    </div>
  </div>
  <button id="bench">⏱  FPS 벤치마크 실행</button>
</div>

<div id="stats" class="glass">
  <h4>측정</h4>
  <div class="s"><i>합성 시간</i><b id="stBuild">—</b></div>
  <div class="s"><i>텍스처 메모리</i><b id="stMem">—</b></div>
  <div class="s"><i>소스 / 레이어</i><b id="stSrc">—</b></div>
  <div class="s"><i>지오메트리 점</i><b id="stPts">—</b></div>
  <div class="s"><i>장소 핀</i><b id="stPoi">—</b></div>
  <div class="s"><i>썸네일 / 화면내</i><b id="stTop">—</b></div>
  <div class="s"><i>폴리곤 조각</i><b id="stPieces">—</b></div>
  <div class="s" style="margin-top:6px"><i>평균 FPS</i><b id="stAvg">—</b></div>
  <div class="s"><i>최저 FPS</i><b id="stMin">—</b></div>
  <div class="s"><i>1% 저점</i><b id="stP1">—</b></div>
</div>

<div id="sheet" class="glass">
  <div id="grab"><i></i></div>
  <div id="sheetHead"><b id="shTitle">이 지역</b><span id="shSub">—</span><small id="shWhy"></small>
    <span id="sortSeg">
      <button data-v="likes" aria-pressed="true">반응순</button>
      <button data-v="near">가까운순</button>
    </span>
  </div>
  <div id="chips"></div>
  <!-- ★ 함께 채운 지도 (§12.28) — 지도는 하나, 무엇을 볼지만 고른다.
       신뢰 칩(몇 명이 다녀갔나) **위**에 둔다: 누구 것을 볼지가 먼저고, 그 안에서 거른다. -->
  <div id="scopes"></div>
  <div id="trust"></div>
  <div id="list"></div>
</div>

<div id="regionBar" class="glass">
  <b id="regionName">—</b><span>만 보는 중</span>
  <span class="x" id="regionX">✕</span>
</div>
<div id="zoomHint" class="glass"></div>
<div id="hover" class="glass"></div>
<div id="boot">행정경계 불러오는 중…</div>

<script src="config.js" onerror="console.warn('[config] 없음 — 로컬 JSON으로 돕니다')"></script>
<script src="vendor/maplibre-gl.js"></script>
<script>
const $ = s => document.querySelector(s);
const state = {
  minU: 0,        // 기여자 수 하한 (§13.10)
  region: null,   // 지역 스코프 {code, name} (§13.13)
  mode:'atlas', count:90, theme:'dark', veil:true, contrast:'high', pins:true,
                lens:'all', cat:'all', sheet:'peek', quota:true,
                anchor:null, radius:0, sort:'likes', mosaic:false };

/* 카테고리 색 — 채도를 눌러 사진과 싸우지 않게 한다 (경쟁사 형광 원색의 반대) */
/* pin_category enum 11종과 1:1로 맞춘다 (db/migrations/001).
   화면 칩은 6개로 묶지만 **저장은 11개로** 세분화한다 — 묶음을 바꿔도 데이터가 살아 있게. */
const CAT = {
  sight   :{ c:'#7FA8C4', k:'관광' },   /* 프로토타입 데모 전용 (실제 enum에는 없다) */
  nature  :{ c:'#8FBF9A', k:'자연' },
  beach   :{ c:'#6FB5B3', k:'해변' },
  heritage:{ c:'#A8A2C4', k:'문화재' },
  activity:{ c:'#7FA8C4', k:'액티비티' },
  food    :{ c:'#C98A6E', k:'맛집' },   /* 전체의 37%라 가장 눌러야 한다 */
  cafe    :{ c:'#BCA07C', k:'카페' },
  bar     :{ c:'#9D89B5', k:'술집' },
  stay    :{ c:'#B59D89', k:'숙박' },
  shop    :{ c:'#93A3B5', k:'상점' },
  event   :{ c:'#C4A2A8', k:'행사' },
  etc     :{ c:'#8b93a3', k:'기타' },
};

/* 바다 / 육지 / 경계선 대비 단계.
   바다는 더 어둡게, 육지는 살짝 밝게 — 양방향으로 벌려야 국토 윤곽이 살면서도
   미방문 지역이 시끄러워지지 않는다. */
const CONTRAST = {
  dark:{
