    high:{ bg:'#08090C', land:'#282B36', stroke:'rgba(255,255,255,0.22)', strokeV:'rgba(255,255,255,0.42)', water:'#0E182E' },
  },
  light:{
    low :{ bg:'#FAF9F7', land:'#F1EFEC', stroke:'rgba(0,0,0,0.07)', strokeV:'rgba(0,0,0,0.18)', water:'#DDE6EE' },
    mid :{ bg:'#FDFCFA', land:'#ECE8E2', stroke:'rgba(0,0,0,0.12)', strokeV:'rgba(0,0,0,0.26)', water:'#D3DFEA' },
    high:{ bg:'#FFFFFF', land:'#E4DFD7', stroke:'rgba(0,0,0,0.18)', strokeV:'rgba(0,0,0,0.34)', water:'#C8D8E6' },
  },
};
let PHOTOS = [];           // photos/_meta.json 에서 채운다
let PHOTO_META = [];
const ATLAS_PX = 4096;          // 아틀라스 한 변 최대 픽셀
const PER_REGION_PX = 512;      // 개별 모드 지역당 한 변 픽셀

/* 화면에 썸네일로 그릴 최대 개수.
   강남 z13은 화면 안에 장소가 1,748곳이다. 충돌 제거만으로는 69개가 남는데
   그것도 도배로 보이고, 나머지 1,679곳은 흔적조차 없어 "여기 더 있다"를 알 수 없다.
   → 상위 N개만 썸네일, 그다음은 작은 점, 나머지는 리스트에만. */
const topN = z => z < 12 ? 10 : z < 14 ? 16 : 24;

/* ★ 줌에 따라 **단위 자체가 바뀐다** (§13.11).
   전국 줌에서 개별 핀을 보여 줄 이유가 없다 — 그 줌에서 답해야 하는 질문은
   *"어느 지역에 볼 곳이 많나"* 이지 *"이 카페가 어디냐"* 가 아니다.
   핀 개수만 깎는 것(rk)은 같은 질문에 더 작게 답하는 것일 뿐, 질문을 바꾸지 못한다. */
const Z_REGION = 9;    // 이 아래는 시·군·구 집계
const Z_ALL    = 13;   // 이 위는 전부
const zoomUnit = z => z < Z_REGION ? 'region' : z < Z_ALL ? 'top' : 'all';

let map, geo, poi = null, water = null, feats = [], visited = [], imgs = [], totalPts = 0;
let addedSources = [], addedLayers = [], addedImages = [];

/* ---------- mercator helpers ---------- */
/* 웹 메르카토르: x와 y를 같은 단위(라디안)로 맞춰야 비율이 깨지지 않는다 */
const mercX = lon => lon * Math.PI / 180;
const mercY = lat => Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360));

function mercAspect(bbox){                    // 폭/높이 비
  const [w,s,e,n] = bbox;
  return (mercX(e)-mercX(w)) / (mercY(n)-mercY(s));
}

function makeProjector(bbox, W, H){
  const [w,s,e,n] = bbox;
  const mx0 = mercX(w), my0 = mercY(n);       // 좌상단
  const dx = mercX(e) - mx0, dy = mercY(s) - my0;
  return {
    x: lon => (mercX(lon) - mx0) / dx * W,
    y: lat => (mercY(lat) - my0) / dy * H,
  };
}

function tracePolys(ctx, polys, P){
  ctx.beginPath();
  for(const poly of polys){
    for(const ring of poly){
      ring.forEach(([lon,lat],i)=>{
        const x = P.x(lon), y = P.y(lat);
        i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
      });
      ctx.closePath();
    }
  }
}

/* cover-fit: bbox 영역을 사진으로 꽉 채우되 비율 유지 */
function drawCover(ctx, img, x, y, w, h){
  const r = Math.max(w/img.width, h/img.height);
  const dw = img.width*r, dh = img.height*r;
  ctx.drawImage(img, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
}

function loadImg(src){
  return new Promise((res,rej)=>{
    const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src;
  });
}

/* 핀용 원형 썸네일 — 카테고리 색 테두리를 아이콘에 직접 굽는다.
   링을 별도 circle 레이어로 두면 아이콘이 충돌로 숨겨져도 링만 남아
   화면에 색 덩어리가 생긴다. (실제로 발생했던 문제) */
function circleIcon(img, color, px=80){
  const cv=document.createElement('canvas'); cv.width=cv.height=px;
  const ctx=cv.getContext('2d'), r=px/2, ring=5;
  ctx.save();
  ctx.beginPath(); ctx.arc(r,r,r-ring,0,Math.PI*2); ctx.clip();
  const s=Math.max((px-ring*2)/img.width,(px-ring*2)/img.height);
  ctx.drawImage(img, r-img.width*s/2, r-img.height*s/2, img.width*s, img.height*s);
  ctx.restore();
  ctx.beginPath(); ctx.arc(r,r,r-ring+1.2,0,Math.PI*2);
  ctx.lineWidth=2.4; ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(r,r,r-ring/2,0,Math.PI*2);
  ctx.lineWidth=ring; ctx.strokeStyle=color; ctx.stroke();
  return ctx.getImageData(0,0,px,px);
}

/* ---------- cleanup ---------- */
function clearPhotoLayers(){
  addedLayers.forEach(id => map.getLayer(id) && map.removeLayer(id));
  addedSources.forEach(id => map.getSource(id) && map.removeSource(id));
  addedLayers = []; addedSources = [];
}

/* 지역 폴리곤에 넣을 대표 사진 — 그 지역에서 찍힌 사진을 우선한다.
   순번대로 배정하면 전라도 타일에 서울 사진이 들어가 설득력이 무너진다. */
const regionPhotoCache = {};
function photoForRegion(f){
  const code=f.properties.code;
  if(regionPhotoCache[code]!=null) return regionPhotoCache[code];
  const sido=f.properties.sido||'', name=f.properties.name||'';
  const keys=Object.keys(REGION_POOL).filter(k=> sido.includes(k) || name.includes(k));
  let pool=null;
  for(const k of keys){ if(REGION_POOL[k] && REGION_POOL[k].length){ pool=REGION_POOL[k]; break; } }
  if(!pool) pool = SCENIC_POOL.length ? SCENIC_POOL : PHOTO_META.map(m=>m.i);
  const seed = code.split('').reduce((a,c)=>a*31+c.charCodeAt(0),7);
  return regionPhotoCache[code] = pool[Math.abs(seed) % pool.length];
}
let REGION_POOL = {}, SCENIC_POOL = [];

/* ---------- 폴리곤 모자이크 분할 ----------
   시·군·구 하나에 사진 한 장이면, 강릉에 열 번 가도 항구 사진 한 장으로 끝난다.
   → 기록이 일정 수 이상인 지역은 **실제 기록 위치를 씨앗으로 보로노이 분할**해
     조각마다 다른 사진을 넣는다. "많이 간 곳이 시각적으로도 풍성해진다."
   보로노이 셀 = 이웃 씨앗들과의 수직이등분선으로 자른 반평면들의 교집합(볼록다각형).
   씨앗이 6개 이하라 Sutherland–Hodgman 반평면 클리핑으로 충분히 싸게 구한다. */

function clipHalfPlane(poly, mx, my, nx, ny){
  // dot(x - m, n) <= 0 쪽(=씨앗 A에 가까운 쪽)만 남긴다
  const inside = p => (p[0]-mx)*nx + (p[1]-my)*ny <= 0;
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const ia=inside(a), ib=inside(b);
    if(ia) out.push(a);
    if(ia!==ib){
      const da=(a[0]-mx)*nx+(a[1]-my)*ny, db=(b[0]-mx)*nx+(b[1]-my)*ny;
      const t=da/(da-db);
      out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]);
    }
  }
  return out;
}

function voronoiCell(seeds, i, bbox){
  let poly=[[bbox[0],bbox[1]],[bbox[2],bbox[1]],[bbox[2],bbox[3]],[bbox[0],bbox[3]]];
  const A=seeds[i];
  for(let j=0;j<seeds.length && poly.length;j++){
    if(j===i) continue;
    const B=seeds[j];
    poly = clipHalfPlane(poly, (A[0]+B[0])/2, (A[1]+B[1])/2, B[0]-A[0], B[1]-A[1]);
  }
  return poly;
}

const MOSAIC_MIN = 4;     // 기록 4개 이상인 지역만 분할
const MOSAIC_MAX = 6;     // 조각은 최대 6개 — 더 쪼개면 알아볼 수 없다
let pinsByRegion = {};

function seedsFor(f, P){
  const list = pinsByRegion[f.properties.code];
  if(!list || list.length < MOSAIC_MIN) return null;
  return list.slice(0, MOSAIC_MAX).map(g=>({
    xy:[P.x(g.geometry.coordinates[0]), P.y(g.geometry.coordinates[1])],
    img: g.properties.imgi }));
}

/* 지역 하나를 캔버스에 그린다. 분할 가능하면 조각별로, 아니면 대표 1장으로. */
function paintRegion(ctx, f, P, bbox){
  const seeds = state.mosaic ? seedsFor(f, P) : null;
  const x0=P.x(bbox[0]), x1=P.x(bbox[2]), y0=P.y(bbox[3]), y1=P.y(bbox[1]);
  if(!seeds){
    ctx.save(); tracePolys(ctx, f.geometry.coordinates, P); ctx.clip('evenodd');
    drawCover(ctx, imgs[photoForRegion(f)], x0, y0, x1-x0, y1-y0);
    ctx.restore();
    return 1;
  }
  const pad=(x1-x0+y1-y0)*0.6;
  const box=[x0-pad, y0-pad, x1+pad, y1+pad];
  const pts=seeds.map(s=>s.xy);
  seeds.forEach((s,i)=>{
    const cell=voronoiCell(pts,i,box);
    if(cell.length<3) return;
    ctx.save();
    tracePolys(ctx, f.geometry.coordinates, P); ctx.clip('evenodd');   // 지역 안으로
    ctx.beginPath();
    cell.forEach(([x,y],k)=> k?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.closePath(); ctx.clip();                                        // 보로노이 셀 안으로
    drawCover(ctx, imgs[s.img], x0, y0, x1-x0, y1-y0);
    ctx.restore();
  });
  return seeds.length;
}

/* ---------- render modes ---------- */
function buildAtlas(){
  const t0 = performance.now();
  const [w,s,e,n] = geo.bbox;
  const aspect = mercAspect(geo.bbox);
  let W = ATLAS_PX, H = Math.round(ATLAS_PX / aspect);
  if(H > ATLAS_PX){ H = ATLAS_PX; W = Math.round(ATLAS_PX * aspect); }

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const P = makeProjector(geo.bbox, W, H);

  let pieces = 0;
  visited.forEach(f=>{ pieces += paintRegion(ctx, f, P, f.properties.bbox); });
  window.__pieces = pieces;

  const build = performance.now() - t0;

  map.addSource('atlas', {
    type:'canvas', canvas:cv, animate:false,
    coordinates:[[w,n],[e,n],[e,s],[w,s]]
  });
  addedSources.push('atlas');
  map.addLayer({ id:'atlas-l', type:'raster', source:'atlas',
    paint:{ 'raster-fade-duration':0, 'raster-resampling':'linear',
            'raster-opacity':['interpolate',['linear'],['zoom'], 8.6,1, 9.4,0] } }, 'region-line');
  addedLayers.push('atlas-l');

  return { build, mem: W*H*4, srcs:1, layers:1, px:`${W}×${H}` };
}

function buildPerRegion(){
  const t0 = performance.now();
  let mem = 0;
  visited.forEach((f,idx)=>{
    const bb = f.properties.bbox;
    const asp = mercAspect(bb);
    let W = PER_REGION_PX, H = Math.round(PER_REGION_PX/asp);
    if(H > PER_REGION_PX){ H = PER_REGION_PX; W = Math.round(PER_REGION_PX*asp); }
    W = Math.max(W,8); H = Math.max(H,8);

    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const P = makeProjector(bb, W, H);
    tracePolys(ctx, f.geometry.coordinates, P);
    ctx.clip('evenodd');
    drawCover(ctx, imgs[photoForRegion(f)], 0, 0, W, H);
    mem += W*H*4;

    const sid = 'r'+idx;
    map.addSource(sid, { type:'canvas', canvas:cv, animate:false,
      coordinates:[[bb[0],bb[3]],[bb[2],bb[3]],[bb[2],bb[1]],[bb[0],bb[1]]] });
    map.addLayer({ id:sid+'l', type:'raster', source:sid,
      paint:{ 'raster-fade-duration':0, 'raster-opacity':['interpolate',['linear'],['zoom'], 8.6,1, 9.4,0] } }, 'region-line');
    addedSources.push(sid); addedLayers.push(sid+'l');
  });
  return { build: performance.now()-t0, mem, srcs:visited.length, layers:visited.length, px:`${PER_REGION_PX}px/지역` };
}

function buildFlat(){
  // 경쟁사 방식: 지역마다 채도 높은 단색
  const t0 = performance.now();
  const palette = ['#7CFC00','#00E5FF','#FF00E5','#FF7A00','#FFE600','#00FF95','#FF2D55','#2D7BFF'];
  const codes = {};
  visited.forEach((f,i)=> codes[f.properties.code] = palette[i%palette.length]);
  const expr = ['match',['get','code']];
  Object.entries(codes).forEach(([k,v])=>expr.push(k,v));
  expr.push('rgba(0,0,0,0)');
  map.addLayer({ id:'flat-l', type:'fill', source:'sgg',
    paint:{ 'fill-color':expr,
            'fill-opacity':['interpolate',['linear'],['zoom'], 8.6,0.92, 9.4,0] } }, 'region-line');
  addedLayers.push('flat-l');
  return { build: performance.now()-t0, mem:0, srcs:0, layers:1, px:'—' };
}

/* ---------- orchestration ---------- */
function pickVisited(n){
  // 전국에 고르게 퍼지도록 시도별로 라운드로빈
  const bySido = {};
  feats.forEach(f=>(bySido[f.properties.sido] ||= []).push(f));
  const keys = Object.keys(bySido);
  keys.forEach(k => bySido[k].sort((a,b)=>a.properties.code.localeCompare(b.properties.code)));
  const out = []; let i = 0;
  while(out.length < n){
    let moved = false;
    for(const k of keys){
      if(bySido[k][i]){ out.push(bySido[k][i]); moved = true; if(out.length>=n) break; }
    }
    if(!moved) break;
    i++;
  }
  return out;
}

function render(){
  clearPhotoLayers();
  visited = pickVisited(state.count);
  const codes = visited.map(f=>f.properties.code);
  map.setFilter('region-unvisited', ['!', ['in',['get','code'], ['literal',codes]]]);

  /* 폴리곤 분할의 씨앗 = 현재 렌즈에서 보이는 실제 기록들 */
  pinsByRegion = {};
  if(poi){
    const L = LENS[state.lens];
    for(const f of poi.features){
      if(!L.pick(f)) continue;
      const r=f.properties.r; if(!r) continue;
      (pinsByRegion[r] ||= []).push(f);
    }
    for(const k in pinsByRegion)
      pinsByRegion[k].sort((a,b)=>b.properties.likes-a.properties.likes);
  }

  let info;
  if(state.mode==='atlas')          info = buildAtlas();
  else if(state.mode==='perRegion') info = buildPerRegion();
  else                              info = buildFlat();

  applyVeil();
  updateBorderColors(codes);

  const pct = (visited.length / feats.length * 100).toFixed(1);
  $('#covPct').textContent = pct + '%';
  $('#covCnt').textContent = `${visited.length} / ${feats.length}`;
  $('#stBuild').textContent = info.build.toFixed(0) + ' ms';
  $('#stBuild').className = info.build < 200 ? 'good' : info.build < 800 ? 'warn' : 'bad';
  const mb = info.mem/1048576;
  $('#stMem').textContent = info.mem ? `${mb.toFixed(1)} MB` : '—';
  $('#stMem').className = mb < 80 ? 'good' : mb < 200 ? 'warn' : 'bad';
  $('#stSrc').textContent = `${info.srcs} / ${info.layers}`;
  $('#stSrc').className = info.srcs < 10 ? 'good' : info.srcs < 120 ? 'warn' : 'bad';
  $('#stPts').textContent = totalPts.toLocaleString();
  $('#stPoi').textContent = poi ? poi.features.length.toLocaleString() : '—';
  if($('#stPieces')) $('#stPieces').textContent =
    window.__pieces ? `${window.__pieces} / ${visited.length}개 지역` : '—';
}

function updateBorderColors(codes){
  const css = getComputedStyle(document.documentElement);
  map.setPaintProperty('region-line','line-color',
    ['case', ['in',['get','code'],['literal',codes]],
      css.getPropertyValue('--region-stroke-visited').trim(),
      css.getPropertyValue('--region-stroke').trim()]);
}

function applyVeil(){
  if(!map.getLayer('veil')) return;
  map.setPaintProperty('veil','fill-opacity', state.veil
    ? ['interpolate',['linear'],['zoom'], 8.6,0.07, 9.4,0] : 0);
}



/* ================= 기준점(Anchor) · 거리 · 검색 =================
   "우리 숙소에서 얼마나 먼지 + 얼마나 이쁜지"를 한 화면에서 보는 것이 이 앱의 핵심 효용이다.
   지도앱은 거리는 알려주지만 사진이 없고, 인스타는 사진은 있지만 거리를 모른다.

   기준점은 GPS만이 아니다. 여행 중에는 **내 현재 위치보다 숙소가 더 중요한 기준**일 때가 많다.
   그래서 GPS를 기준점의 한 종류로 일반화한다. */

const R = 6371000;
function distM(a, b){
  const t = Math.PI/180;
  const dLat=(b.lat-a.lat)*t, dLng=(b.lng-a.lng)*t;
  const la1=a.lat*t, la2=b.lat*t;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? `${Math.round(m/10)*10}m` : `${(m/1000).toFixed(m<10000?1:0)}km`;
/* 도보 4.5km/h 기준. 1.2km를 넘으면 걷는 거리로 안 읽히므로 차로 바꿔 말한다 */
const fmtWalk = m => m<=1200 ? `도보 ${Math.max(1,Math.round(m/75))}분` : `차 ${Math.max(1,Math.round(m/450))}분`;

function circleGeo(lat, lng, radiusM, steps=64){
  const ring=[];
  const dLat = radiusM/111320;
  const dLng = radiusM/(111320*Math.cos(lat*Math.PI/180));
  for(let i=0;i<=steps;i++){
    const t = i/steps*2*Math.PI;
    ring.push([lng+dLng*Math.cos(t), lat+dLat*Math.sin(t)]);
  }
  return {type:'FeatureCollection',features:[{type:'Feature',properties:{},
          geometry:{type:'Polygon',coordinates:[ring]}}]};
}

/* 지역 스코프를 건다/푼다. 바(bar)로 **지금 좁혀져 있다는 것**을 보여준다 —
   말없이 목록만 줄면 사용자는 데이터가 없는 줄 안다. */
function setRegionScope(code, name){
  state.region = { code, name };
  $('#regionBar').classList.add('on');
  $('#regionName').textContent = name;
  refreshPoi(); renderList();
}
function clearRegionScope(){
  if(!state.region) return;
  state.region = null;
  $('#regionBar').classList.remove('on');
  refreshPoi(); renderList();
}

function setAnchor(lat, lng, label, fly=true){
  state.anchor = {lat, lng, label};
  $('#anchorBar').classList.add('on');
  $('#anchorName').textContent = label;
  $('#btnGps').classList.add('on');
  map.getSource('anchor').setData({type:'FeatureCollection',features:[
    {type:'Feature',properties:{},geometry:{type:'Point',coordinates:[lng,lat]}}]});
  drawRadius();
  if(fly) map.flyTo({center:[lng,lat], zoom:Math.max(map.getZoom(),13), duration:700});
  refreshPoi();
}
function clearAnchor(){
  state.anchor=null; state.radius=0; state.sort='likes';
  $('#anchorBar').classList.remove('on');
  $('#btnGps').classList.remove('on');
  map.getSource('anchor').setData({type:'FeatureCollection',features:[]});
  map.getSource('radius').setData({type:'FeatureCollection',features:[]});
  document.querySelectorAll('#sortSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v==='likes'));
  refreshPoi();
}
function drawRadius(){
  const a=state.anchor;
  map.getSource('radius').setData(
    (a && state.radius) ? circleGeo(a.lat,a.lng,state.radius) : {type:'FeatureCollection',features:[]});
}

/* ---- 검색: 지역 + 장소 통합 ---- */
async function runSearch(q){
  const box=$('#searchRes');
  q=(q||'').trim();
  if(!q){
    box.innerHTML = `<div id="searchHint">지역이나 장소를 검색해 보세요.<br>
      검색 결과에서 <b>[기준]</b>을 누르면 그 곳을 기준점으로 삼아<br>
      모든 장소까지의 거리가 표시됩니다.</div>`;
    return;
  }
  const regions = feats.filter(f=>f.properties.name.includes(q)).slice(0,5);
  /* ★ 장소는 서버를 먼저 본다. 로컬 `places-real.json` 에는 46만 곳 중
     5만 곳만 담겨 있어 **없는 곳을 "결과 없음"이라고 말한다.**
     서버가 안 되면 조용히 로컬로 떨어진다 — 화면은 항상 돈다. */
  let places = poi.features.filter(f=>f.properties.n.includes(q)).sort(
                    (a,b)=>b.properties.likes-a.properties.likes).slice(0,14);
  let via = 'local', srv = null;
  if (window.API && API.on) {
    const r = await API.search(q, 14);
    if (r.ok && Array.isArray(r.data) && r.data.length) {
      via = 'server';
      /* ★ 서버 응답을 poi 모양에 억지로 끼워 맞추지 않는다.
         처음엔 `{n, c, rn, likes, img}` 로 변환했는데 서버에는 그런 필드가 없어
         **카테고리가 전부 '기타', 지역은 빈칸, 썸네일은 전부 같은 사진**이 됐다.
         `api_search` 는 `{kind, id, name, sub, lng, lat, cover_url}` 을 준다 —
         `sub` 에 '지역 · 카테고리'가 이미 들어 있다. 있는 것을 그대로 쓴다. */
      srv = r.data.filter(x => x.kind === 'place');
    }
  }
  if(!regions.length && !places.length && !(srv && srv.length)){
    box.innerHTML = `<div id="searchHint">"${q}" 결과가 없습니다.</div>`; return;
  }
  const row = (icon,title,sub,data,anchor) =>
    `<div class="sres" ${data}>${icon}<div><b>${title}</b><small>${sub}</small></div>`+
    `<span class="anch" data-anchor="1">기준</span></div>`;
  box.innerHTML =
    (via==='server' ? `<div class="sVia">서버에서 찾음 · 전국 46만 곳</div>`
                    : `<div class="sVia off">로컬 목록 · 5만 곳만 담겨 있습니다</div>`) +
    regions.map(f=>{
      const b=f.properties.bbox, cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2;
      return row(`<div class="ic">◈</div>`, f.properties.name, `${f.properties.sido} · 지역`,
                 `data-x="${cx}" data-y="${cy}" data-z="11" data-label="${f.properties.name}"`);
    }).join('') +
    (srv
      ? srv.map(x => row(`<div class="ic">◉</div>`, x.name, x.sub || '',
          `data-x="${x.lng}" data-y="${x.lat}" data-z="15" data-label="${x.name}" data-place="${x.name}"`)).join('')
      : places.map(f=>{
          const p=f.properties, [x,y]=f.geometry.coordinates;
          return row(`<img src="${p.photoUrl || PHOTOS[+String(p.img||'ph0').slice(2)]}" loading="lazy" alt="">`,
                     p.n, `${CAT[p.c].k} · ${p.rn} · ♥ ${p.likes}`,
                     `data-x="${x}" data-y="${y}" data-z="15" data-label="${p.n}" data-place="${p.n}"`);
        }).join(''));
}

/* ================= 레이어 · 카테고리 · 뷰포트 연동 리스트 =================
   설계안 (C): `나의 기록`은 폴리곤 사진(성취·감성), `전체 공개`는 장소 핀(정보).
   두 레이어는 시각 언어 자체가 다르다. */

/* 렌즈(LENS) — 지금 지도에 무엇을 띄울 것인가.
   소유(모든 기록은 내 것) / 공개 범위(기록별 속성) / 렌즈(UI)는 서로 다른 축이다.
   v3까지 셋을 한 줄에 뭉개서 `나의 기록`과 `전체 공개`가 배타적이지 않은 모순이 있었다. */
/* 데모 작성자. u1이 '나'다.
   내가 보는 `내 지도`(전부)와 남이 보는 `@나의 지도`(공개분만)의 차이가 핵심이다. */
const USERS = [
  { id:'u1', name:'민지',  handle:'@minji'  },
  { id:'u2', name:'도현',  handle:'@dohyun' },
  { id:'u3', name:'서연',  handle:'@seoyeon'},
  { id:'u4', name:'준호',  handle:'@junho'  },
  { id:'u5', name:'하윤',  handle:'@hayun'  },
  { id:'u6', name:'태민',  handle:'@taemin' },
];
const USER = Object.fromEntries(USERS.map(u=>[u.id,u]));

/* 스페이스는 **관계**로 짓는다. 여행 이름으로 지으면 여행마다 새로 만들게 된다. PLAN §6.7 */
/* ★ 스페이스는 **사람의 집합**이다. 멤버를 여기 한 곳에만 적는다 —
   spaces.js 가 따로 들고 있으면 둘이 갈라진다(§13.7에서 겪은 그대로). */
const SPACES = [
  { id:'sp1', name:'대학 동기들', users:['u1','u2','u3'] },
  { id:'sp2', name:'가족',       users:['u1','u5','u6'] },
];
SPACES.forEach(sp => sp.members = sp.users.length);
const SPACE_OF_USER = {};
SPACES.forEach(sp => sp.users.forEach(u => (SPACE_OF_USER[u] ||= []).push(sp.id)));
const LENS = {
  all : { name:'모두의 지도', sub:'전체 공개된 기록', poly:false, pick:f=>f.properties.pub },
  mine: { name:'내 지도',     sub:'내 기록 전부',     poly:true,  pick:f=>f.properties.mine },
};
/* 프로필 렌즈 — 그 사람이 공개한 기록만.
   피드에서 사진 한 장을 보고 작성자로 들어가면 그 사람의 여행 지도가 통째로 보인다.
   `내 지도`(내 전부)의 공개 버전이 곧 `@나의 지도`다. */
USERS.forEach(u=>{
  LENS['p_'+u.id] = { name:`${u.handle}의 지도`, sub:'공개한 기록만', poly:true, profile:u.id,
                      pick:f=>f.properties.au===u.id && f.properties.pub };
});

SPACES.forEach(sp=>{
  LENS[sp.id] = { name:sp.name, sub:`멤버 ${sp.members}명`, poly:true, space:true,
                  pick:f=>f.properties.sp===sp.id };
});

function visiblePois(){
  if(!poi) return [];
  const L = LENS[state.lens];
  const b = map.getBounds(), w=b.getWest(), e=b.getEast(), s2=b.getSouth(), n=b.getNorth();
  const out=[];
  for(const f of poi.features){
    if(!L.pick(f)) continue;
    if(state.cat!=='all' && f.properties.c!==state.cat) continue;
    if(!passTrust(f)) continue;          // 지도와 목록이 **같은 것**을 보여야 한다
    if(!passRegion(f)) continue;
    const [x,y]=f.geometry.coordinates;
    if(x<w||x>e||y<s2||y>n) continue;
    out.push(f);
  }
  const a = state.anchor;
  if(a){
    for(const f of out){
      const [x,y]=f.geometry.coordinates;
      f.properties.d = distM(a, {lat:y, lng:x});
    }
  }
  const filtered = (a && state.radius)
    ? out.filter(f=>f.properties.d <= state.radius) : out;

  if(a && state.sort==='near') filtered.sort((p,q)=>p.properties.d-q.properties.d);
  else filtered.sort((p,q)=>q.properties.likes-p.properties.likes);
  return filtered;
}

/* 소스 데이터 자체를 갈아끼운다 — 클러스터 개수가 필터를 반영해야 하므로 */
/* ★ 숫자 필터 — **사진 수가 아니라 사람 수**로 자른다.
   한 사람이 100장 올린 곳과 30명이 3장씩 올린 곳은 완전히 다르다.
   뒤쪽이 '검증된 곳'이다 — §009 현장 인증과 같은 철학이다.

   ★ 그리고 절대 숫자(100/500/1000)를 쓰지 않는다. 두 가지 이유다:
     1. 분포가 파워 로우라 런칭 직후엔 **전부 첫 버킷**에 들어가 필터가 작동하지 않는다.
     2. 절대 숫자는 **시간이 지나면 뜻이 변한다** — 1년 뒤엔 100장이 흔해진다.
   → 뜻을 담은 이름 + 칩마다 **지금 몇 곳인지** 숫자를 같이 띄운다.
     기준이 현실과 어긋나면 사용자도 우리도 화면에서 바로 안다. */
const TRUST = [
  { v: 0,  k: '전체',        d: null },
  { v: 2,  k: '2명 이상',    d: '혼자 올린 곳은 뺍니다' },
  { v: 5,  k: '5명 이상',    d: '여러 사람이 확인한 곳' },
  { v: 20, k: '20명 이상',   d: '많이 찾는 곳' },
];
const passTrust = f => (f.properties.nu || 0) >= (state.minU || 0);
/* ★ 지역 스코프 — 집계 지역을 탭해서 들어왔을 때, 목록도 **그 지역만** 보여준다.
   bbox 로 확대하면 뷰포트에는 옆 시·군이 같이 들어온다. `강릉시`를 눌렀는데
   목록에 동해시·양양군이 섞이면 **내가 뭘 눌렀는지 알 수 없다.**
   경계는 이미 법정동코드로 갖고 있으니(§10.34) 코드로 자른다. */
const passRegion = f => !state.region || f.properties.r === state.region.code;

/* 지금 화면의 필터(렌즈·카테고리·사람 수)를 **그대로 적용해** 시·군·구별로 센다.
   ★ 필터를 무시하고 전체를 세면, `20명 이상`을 켜고 전국으로 나갔을 때 지도가 안 변한다.
     그러면 "인기 있는 곳이 많은 지역"을 볼 수가 없다 — 이 기능의 존재 이유가 사라진다. */
function regionAgg(){
  const L = LENS[state.lens], out = {};
  for(const f of poi.features){
    if(!L.pick(f)) continue;
    if(state.cat!=='all' && f.properties.c!==state.cat) continue;
    if(!passTrust(f)) continue;
    const r = f.properties.r; if(!r) continue;
    out[r] = (out[r]||0) + 1;
  }
  return out;
}

let aggMax = 1;
function paintRegions(){
  if(!map.getSource('sgg')) return;
  const agg = regionAgg();
  aggMax = Math.max(1, ...Object.values(agg));
  for(const f of feats){
    const code = f.properties.code;
    const n = agg[code]||0;
    map.setFeatureState({ source:'sgg', id:code },
      { n, lg: n ? Math.log(1+n)/Math.log(1+aggMax) : 0 });
  }
  // 라벨 — 값이 있는 곳만. 0곳까지 숫자를 찍으면 화면이 0으로 덮인다.
  const src = map.getSource('sggPt');
  if(src) src.setData({ type:'FeatureCollection', features: feats
    .filter(f=>(agg[f.properties.code]||0) > 0)
    .map(f=>{ const b=f.properties.bbox;
      return { type:'Feature', properties:{ n: agg[f.properties.code],
                 name: f.properties.name },
               geometry:{ type:'Point', coordinates:[(b[0]+b[2])/2,(b[1]+b[3])/2] } }; }) });
}

/* 줌이 바뀌면 보여 주는 것 자체를 바꾼다 */
function applyZoomUnit(){
  const u = zoomUnit(map.getZoom());
  const show = (id, on) => { if(map.getLayer(id))
    map.setLayoutProperty(id,'visibility', on ? 'visible':'none'); };
  ['region-heat','region-count'].forEach(id=>show(id, u==='region'));
  // 집계 줌에서는 핀도 사진 폴리곤도 내린다 — 둘 다 "이 카페가 어디냐"에 답하는 것들이다
  POI_LAYERS.forEach(id=>show(id, u!=='region' && state.pins));
  if(map.getLayer('region-unvisited') && u==='region')
    map.setLayoutProperty('region-unvisited','visibility','none');
  const hint = $('#zoomHint');
  if(hint){
    hint.textContent = u==='region' ? '지역을 누르면 들어갑니다 · 두 손가락으로 확대'
      : u==='top' ? '기록이 많은 장소부터' : '이 화면의 모든 장소';
    hint.classList.toggle('on', true);
  }
}

function refreshPoi(){
  if(!map.getSource('poi')) return;
  paintRegions();
  applyZoomUnit();
  const L = LENS[state.lens];
  let feats = poi.features.filter(f =>
    L.pick(f) && (state.cat==='all' || f.properties.c===state.cat)
       && passTrust(f) && passRegion(f));
  const anc = state.anchor;
  if(anc && state.radius){
    feats = feats.filter(f=>{
      const [x,y]=f.geometry.coordinates;
      return distM(anc,{lat:y,lng:x}) <= state.radius;
    });
  }

  /* 뷰포트 안에서만 순위를 매긴다. 전역 순위로는 지역별 밀도 차이를 못 잡는다
     (강남은 1,748곳, 강릉은 116곳 — 같은 기준을 쓰면 강릉엔 아무것도 안 뜬다). */
  const b=map.getBounds(), w=b.getWest(), e=b.getEast(), s2=b.getSouth(), n=b.getNorth();
  const inView=[];
  for(const f of feats){
    const [x,y]=f.geometry.coordinates;
    if(x>=w && x<=e && y>=s2 && y<=n) inView.push(f); else f.properties.rk = 9999;
  }
  inView.sort((a,b2)=>b2.properties.likes-a.properties.likes);
  const N = topN(map.getZoom());

  /* 카테고리 다양성 쿼터.
     반응 수만으로 뽑으면 맛집이 전체의 43%라 화면이 음식 사진으로 덮인다.
     → 한 카테고리가 썸네일의 40%를 넘지 못하게 막는다.
     "여행 추억 지도"가 "맛집 리뷰 앱"으로 미끄러지는 것을 막는 가장 싼 장치. */
  const QUOTA = Math.max(2, Math.ceil(N * (state.quota ? 0.4 : 1)));
  const used = {};
  const picked = [];
  const spill = [];
  for(const f of inView){
    if(picked.length >= N) break;
    const c = f.properties.c;
    if((used[c]||0) < QUOTA){ used[c] = (used[c]||0)+1; picked.push(f); }
    else spill.push(f);
  }
  // 쿼터 때문에 자리가 남으면 밀렸던 것으로 채운다
  for(const f of spill){ if(picked.length >= N) break; picked.push(f); }

  inView.forEach(f=>{ f.properties.rk = 9999; });
  picked.forEach((f,i)=>{ f.properties.rk = i; });
  window.__mix = used;

  map.getSource('poi').setData({type:'FeatureCollection',features:feats});
  applyLayerVisuals();
  renderList();
  $('#stTop') && ($('#stTop').textContent = `${Math.min(N,inView.length)} / ${inView.length}`);
}

function applyLayerVisuals(){
  const poly = LENS[state.lens].poly;
  ['atlas-l','flat-l','veil'].forEach(id=>{
    if(!map.getLayer(id)) return;
    map.setLayoutProperty(id,'visibility', poly ? 'visible':'none');
  });
  addedLayers.forEach(id=> map.getLayer(id) &&
    map.setLayoutProperty(id,'visibility', poly ? 'visible':'none'));
  // 전체 공개에서는 방문/미방문 구분이 의미 없다 — 육지를 평평하게
  if(map.getLayer('region-unvisited'))
    map.setLayoutProperty('region-unvisited','visibility', poly ? 'visible':'none');
  $('#cov').style.display = poly ? '' : 'none';
}

function renderLensMenu(){
  const item=(k,L)=>`<button data-v="${k}" aria-pressed="${state.lens===k}">${L.name}<span>${L.sub}</span></button>`;
  $('#lensMenu').innerHTML =
    item('mine', LENS.mine) +
    `<hr><div class="sec">스페이스</div>` +
    SPACES.map(sp=>item(sp.id, LENS[sp.id])).join('') +
    `<button class="new" data-v="__new">＋ 새 스페이스<span>여행 폴더 만들기</span></button>` +
    `<hr><div class="sec">프로필 (공개분만)</div>` +
    USERS.slice(0,4).map(u=>`<button data-v="p_${u.id}" aria-pressed="${state.lens==='p_'+u.id}">`+
      `<span class="prof">${u.handle}</span><span>${u.id==='u1'?'나':''}</span></button>`).join('') +
    `<hr>` + item('all', LENS.all);
  $('#lensName').textContent = LENS[state.lens].name;
  $('#lensSub').textContent  = LENS[state.lens].sub;
}

function renderChips(){
  const box=$('#chips');
  const items=[['all','전체',null], ...Object.entries(CAT).map(([k,v])=>[k,v.k,v.c])];
  box.innerHTML = items.map(([k,label,c])=>
    `<button class="chip" data-v="${k}" aria-pressed="${state.cat===k}">`+
    (c?`<em style="background:${c}"></em>`:'')+`${label}</button>`).join('');
  renderTrust();
}

/* ★ 칩마다 **지금 몇 곳인지**를 같이 띄운다.
   기준이 현실과 어긋나면(예: 20명 이상이 0곳) 사용자도 우리도 화면에서 바로 안다.
   숫자 없는 필터는 눌러 보기 전엔 결과를 알 수 없어, 빈 화면을 만들고 신뢰를 깎는다. */
function renderTrust(){
  const box=$('#trust'); if(!box) return;
  const L = LENS[state.lens];
  const b=map.getBounds(), w=b.getWest(), e=b.getEast(), s2=b.getSouth(), n=b.getNorth();
  const inView = poi.features.filter(f=>{
    if(!L.pick(f)) return false;
    if(state.cat!=='all' && f.properties.c!==state.cat) return false;
    if(!passRegion(f)) return false;
    const [x,y]=f.geometry.coordinates;
    return x>=w && x<=e && y>=s2 && y<=n;
  });
  box.innerHTML = TRUST.map(t=>{
    const n2 = inView.filter(f=>(f.properties.nu||0) >= t.v).length;
    return `<button class="tchip" data-u="${t.v}" aria-pressed="${(state.minU||0)===t.v}"
      ${t.d?`title="${t.d}"`:''}>${t.k}<i>${n2.toLocaleString()}</i></button>`;
  }).join('');
}

/* ★ 서버에 있는 기록을 지도에 합친다 (§13.24).
   올린 것이 **다시 보이지 않으면** 사용자에게는 올린 적이 없는 것과 같다.

   ★ 씨앗을 지우지 않고 **옆에 붙인다.** 프로토타입의 값어치는 화면이 차 있는 것인데,
     서버 기록 7개만 남기면 지도가 텅 빈다. 실제 앱에서는 씨앗이 없으므로
     이 합치기가 곧 전부가 된다. */
let SERVER_PINS = [];
/* ★ 이미 읽은 상자. 이 안에 있으면 다시 안 읽는다 — 한 픽셀 밀 때마다 서버를 부르면
   요금과 배터리가 화면을 미는 손가락에 비례한다. */
let LOADED_BOX = null;
let SERVER_MORE = false;
let LOADED_SCOPE = 'all';
/* ★ 함께 채운 지도 (§12.28 · 037) — **지도는 하나**고 무엇을 볼지만 고른다.
   지도를 셋으로 나누면 §12.27에서 접었던 '정리함'과 같은 실수가 된다.
     all    전부 (볼 수 있는 것 모두)
     mine   내가 올린 것 — 나만 보기도 포함한다
     shared 내가 속한 스페이스에 올라온 것 — 내가 올린 것 + 남이 올린 것
     public 공개된 것
   ★ 셋은 **겹친다.** 배타적 3분할이 아니다 — 그래서 칩은 '필터'지 '분류'가 아니다. */
const SCOPES = [
  { v: "all",    k: "전부",   d: "볼 수 있는 기록 전부" },
  { v: "mine",   k: "내 지도", d: "내가 올린 것 — 나만 보기도 포함" },
  { v: "shared", k: "함께",   d: "스페이스에서 함께 보는 기록" },
  { v: "public", k: "모두의", d: "공개된 기록" },
];
const SRC_LABEL = { mine: "내 것", shared: "함께", other: "" };
/* 뷰포트보다 넉넉히 읽는다. 조금씩 미는 동안은 공짜가 된다.
   ★ 크게 잡을수록 왕복은 줄지만 한 번에 오는 양이 는다. 0.4(=화면의 1.8배 넓이)는
     "한 화면 밀어도 안 부른다"를 만족하는 가장 작은 값이다. */
const PAD = 0.4;
const padBox = b => {
  const dx = (b.e - b.w) * PAD, dy = (b.n - b.s) * PAD;
  return { w: b.w - dx, s: b.s - dy, e: b.e + dx, n: b.n + dy };
};
const inside = (inner, outer) => !!outer &&
  inner.w >= outer.w && inner.e <= outer.e && inner.s >= outer.s && inner.n <= outer.n;

async function loadServerPins(force){
  if(!(window.API && API.on)) return 0;
  /* ★ 집계 줌에서는 핀을 안 읽는다. 전국 한 화면이 상자가 되면 "뷰포트로 자른다"가
     아무것도 자르지 않는 말이 된다 — 그 줌에서 화면에 그리는 것은 지역 집계다. */
  if(zoomUnit(map.getZoom()) === 'region'){ return 0; }

  const b0 = map.getBounds();
  const view = { w:b0.getWest(), s:b0.getSouth(), e:b0.getEast(), n:b0.getNorth() };
  // ★ 스코프가 바뀌면 이미 읽은 상자는 소용없다 — 서버가 다른 집합을 준다
  if(!force && LOADED_SCOPE === (state.scope||'all') && inside(view, LOADED_BOX)) return 0;
  const box = padBox(view);

  const r = await API.pinsInBBox(box, {
    limit: 300, cat: state.cat==='all' ? null : state.cat, scope: state.scope || 'all' });
  if(!r.ok) return 0;
  LOADED_BOX = box; SERVER_MORE = r.more; LOADED_SCOPE = state.scope || 'all';

  const seen = new Set(SERVER_PINS.map(f=>f.properties.pinId));
  let added = 0;
  for(const row of r.data){
    if(seen.has(row.id)) continue;
    const f = API.toFeature(row);
    if(!f) continue;
    seen.add(row.id); SERVER_PINS.push(f); poi.features.push(f); added++;
  }
  if(added || r.more){
    // 서버 사진은 URL 이라 PHOTOS 배열에 없다 — imgi 대신 photoUrl 을 쓴다
    try { refreshPoi(); renderList(); } catch(e){ console.warn('[server] 지도 갱신', e); }
  }
  console.log('[server] 화면 안', r.data.length, '개 중', added, '개 추가', r.more ? '(더 있음)' : '');
  return added;
}
window.loadServerPins = loadServerPins;

/* 스코프를 바꾼다. ★ 이전 스코프의 핀을 **걷어낸다** — 안 걷으면 '내 지도'를 골랐는데
   남의 핀이 그대로 남아 있고, 그건 필터가 아니라 그냥 더하기가 된다. */
function setScope(v){
  if((state.scope||'all') === v) return;
  state.scope = v;
  poi.features = poi.features.filter(f => !f.properties.server);
  SERVER_PINS = []; LOADED_BOX = null; SERVER_MORE = false;
  renderScopes();
  loadServerPins(true).then(()=>{ try{ refreshPoi(); }catch(e){} });
}
window.setScope = setScope;

/* ── 초대 링크로 들어왔다 (§13.38) ─────────────────────────────────
   ★ §3 이 "초대 수락률이 핵심 지표"라고 적었다. 그 화면이 **회원가입 폼**이면
     지표가 가장 크게 깎인다 — 그래서 여기서는 아무것도 묻지 않는다.
     무엇을 수락하는지 먼저 보이고, '열기'를 누르면 계정은 **조용히** 생긴다.
   ★ 잃을 수 있다는 것은 **그때** 말한다. 미리 겁주면 열어 보지도 않는다. */
async function openInvite(code){
  if(!(window.API && API.on)) return;
  const p = await API.invitePreview(code);
  // ★ `el()` 은 upload.js 의 헬퍼다 — 이 파일에는 없다. 여기서 직접 만든다.
  const wrap = document.createElement('div');
  wrap.id = 'invWrap';
  wrap.innerHTML = `<div id="invCard" class="glass">
    ${p.ok ? `
      <div class="invHead">초대받으셨습니다</div>
      <b class="invTitle">${p.title}</b>
      <div class="invSub">${p.members}명 · 기록 ${p.pins}곳</div>
      ${p.already
        ? `<div class="invNote">이미 들어와 계신 방입니다.</div>
           <button class="invGo" data-act="close">지도로</button>`
        : `<button class="invGo" data-act="join">열어 보기</button>
           <div class="invNote">가입하지 않고 바로 보실 수 있습니다.
             여러 분이 보내신 링크는 한 곳에 모입니다.</div>`}
    ` : `
      <div class="invHead">열 수 없는 링크입니다</div>
      <div class="invSub">${p.why || '초대 링크가 유효하지 않습니다'}</div>
      <button class="invGo" data-act="close">지도로</button>`}
  </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', async ev=>{
    const b = ev.target.closest('[data-act]');
    if(!b && ev.target.id !== 'invWrap') return;
    if(!b || b.dataset.act === 'close'){ wrap.remove(); return; }
    b.disabled = true; b.textContent = '여는 중…';
    const r = await API.joinSpace(code);
    if(!r.ok){ b.disabled=false; b.textContent='다시 시도'; 
      wrap.querySelector('.invNote').textContent = r.why || '합류하지 못했습니다'; return; }
    wrap.remove();
    /* ★ 합류했으면 **'함께'로 바로 보여 준다.** 지도로 던져 놓고 찾으라고 하면
       무엇이 늘었는지 모른다 — 초대의 값어치가 그 순간 사라진다. */
    setScope('shared');
    try { $('#shTitle').textContent = r.title; } catch(e){}
  });
}
window.openInvite = openInvite;

/* ★ 소셜 로그인에서 돌아왔다 (§13.41). 토큰이 주소의 `#` 뒤에 실려 온다 —
   **지도보다 먼저** 받아서 주소에서 지운다. 늦게 받으면 그 사이에 다른 코드가
   비로그인으로 판단해 익명 계정을 새로 만든다(그러면 방금 이은 계정을 잃는다). */
(function(){
  if (!(location.hash || "").includes("access_token=")) return;
  const t = setInterval(async ()=>{
    if (!(window.API && API.on)) return;
    clearInterval(t);
    const r = await API.consumeAuthRedirect();
    if (r && r.ok) { try { if (window.initMy) initMy(); } catch(e){} }
  }, 100);
  setTimeout(()=>clearInterval(t), 15000);
})();

/* ★ 초대 화면은 **지도를 기다리지 않는다.** 지도 `load` 안에 두었더니 지도가 늦는
   날에는 초대받은 사람이 로딩 화면만 봤다 — 그 사람이 가장 먼저 보는 것이 지도여야
   할 이유가 없다. 링크의 답은 "무엇에 초대받았나"지 "지도가 떴나"가 아니다. */
(function(){
  const code = new URLSearchParams(location.search).get('invite');
  if (!code) return;
  const t = setInterval(()=>{
    if (!(window.API && API.on)) return;     // 다리만 올라오면 된다
    clearInterval(t);
    openInvite(code);
  }, 150);
  setTimeout(()=>clearInterval(t), 15000);
})();

function renderScopes(){
  const box = $('#scopes'); if(!box) return;
  const cur = state.scope || 'all';
  box.innerHTML = SCOPES.map(sc =>
    `<button class="schip" data-scope="${sc.v}" aria-pressed="${cur===sc.v}" title="${sc.d}">${sc.k}</button>`
  ).join('');
}
window.renderScopes = renderScopes;

let listTimer=null;
function renderList(){
  const feats = visiblePois();
  const L = LENS[state.lens];
  $('#shTitle').textContent = state.region ? state.region.name : L.name;
  const scope = state.region ? '이 지역'
    : state.anchor && state.radius
    ? `${state.anchor.label} 반경 ${state.radius<1000?state.radius+'m':(state.radius/1000)+'km'}`
    : '화면 안';
  $('#shSub').textContent = feats.length
    ? `${scope} ${feats.length.toLocaleString()}곳`
    : `${scope}에 기록 없음`;
  /* ★ 탭2는 묶음마다 '왜 떴는지'를 적는데 이 화면은 한 마디도 안 했다.
     탭1 시트는 **사람이 다녀간 증거**고 탭2는 **갈 이유**다 — 둘이 겹쳐 보이지 않으려면 말해야 한다. */
  renderTrust();                          // 화면이 바뀌면 칩의 곳 수도 바뀐다
  /* ★ 서버가 자른 것을 말한다. 안 말하면 사용자는 "내 기록이 왜 없지"를 겪고,
     그건 §13.24 가 막으려던 것과 같은 모양의 침묵이다. */
  /* ★ 겹치는 스코프를 숫자로 풀어 준다 — "모두의 지도 120곳" 안에 내 것이 몇 개인지
     안 보이면 사용자는 자기 기록이 올라갔는지 확인할 방법이 없다. */
  const srcN = feats.reduce((a,f)=>{ const k=f.properties.src; if(k) a[k]=(a[k]||0)+1; return a; }, {});
  const srcLine = (srcN.mine||srcN.shared)
    ? `내 것 ${srcN.mine||0}곳 · 함께 ${srcN.shared||0}곳 · 남 ${srcN.other||0}곳` : '';
  $('#shWhy').textContent = srcLine && !SERVER_MORE ? srcLine : SERVER_MORE && feats.length
    ? '이 화면에 기록이 더 있습니다 — 확대하면 다 보입니다'
    : !feats.length ? ''
    : state.region ? `${state.region.name}에서 사람들이 남긴 기록입니다`
    : '여기 다녀간 사람들이 남긴 기록입니다';

  const box=$('#list');
  if(!feats.length){
    box.innerHTML = `<div id="empty">이 화면에는 아직 기록이 없어요.<br>지도를 움직이거나 카테고리를 바꿔보세요.</div>`;
    return;
  }
  box.innerHTML = feats.slice(0,120).map(f=>{
    const p=f.properties, cat=CAT[p.c];
    const src = p.photoUrl || PHOTOS[+String(p.img||'ph0').slice(2)];
    return `<div class="card" data-x="${f.geometry.coordinates[0]}" data-y="${f.geometry.coordinates[1]}">
      <img src="${src}" loading="lazy" alt="">
      <div class="cmeta">
        <div class="cname">${p.n.replace(/[<>&]/g,'')}</div>
        <div class="cdesc"><em style="background:${cat.c}"></em>${cat.k}
          <span>·</span>${p.rn||''}<span>·</span><b class="cnu">${p.nu}명</b>
          <span>·</span>${p.np}장
          ${p.d!=null&&state.anchor?`<span>·</span><span class="cdist">${fmtDist(p.d)} · ${fmtWalk(p.d)}</span>`:''}</div>
        <div class="cauthor" data-au="${p.au}">${USER[p.au].handle}${
          p.src && SRC_LABEL[p.src] ? `<span class="csrc csrc-${p.src}">${SRC_LABEL[p.src]}</span>` : ''
        }<span class="cver${
          p.ver==='live'?' live':''}">${p.ver==='live'?'현장 인증':'사진 정보'}</span></div>
      </div></div>`;
  }).join('');
}

function applyTheme(){
  const root = document.documentElement;
  root.setAttribute('data-theme', state.theme);
  const c = CONTRAST[state.theme][state.contrast];
  root.style.setProperty('--map-bg', c.bg);
  root.style.setProperty('--region-empty', c.land);
  root.style.setProperty('--region-stroke', c.stroke);
  root.style.setProperty('--region-stroke-visited', c.strokeV);

  const css = getComputedStyle(root);
  const bg = css.getPropertyValue('--map-bg').trim();
  const empty = css.getPropertyValue('--region-empty').trim();
  map.setPaintProperty('bg','background-color', bg);
  map.setPaintProperty('region-base','fill-color', empty);
  map.setPaintProperty('region-unvisited','fill-color', empty);
  map.setPaintProperty('veil','fill-color', bg);
  const wc = c.water;
  if(map.getLayer('water-body'))  map.setPaintProperty('water-body','fill-color', wc);
  if(map.getLayer('water-river')) map.setPaintProperty('water-river','line-color', wc);
  updateBorderColors(visited.map(f=>f.properties.code));
}

/* ---------- FPS benchmark ---------- */
let benching = false;
function bench(){
  if(benching) return;
  benching = true;
  const btn = $('#bench'); btn.disabled = true; btn.textContent = '측정 중…';
  $('#fpsbar').classList.add('on');

  const frames = [];
  let last = performance.now(), raf;
  const tick = t => { frames.push(t - last); last = t;
    const fps = 1000/(frames.slice(-20).reduce((a,b)=>a+b,0)/Math.min(20,frames.length));
    $('#fpsLive').textContent = `${fps.toFixed(0)} FPS`;
    raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);

  // 실제 사용 패턴: 전국 → 수도권 줌인 → 팬 → 줌아웃
  const seq = [
    { center:[127.8,36.3], zoom:6.2, pitch:0,  bearing:0,  duration:1400 },
    { center:[127.02,37.55], zoom:10.2, pitch:0, bearing:0, duration:2000 },
    { center:[126.72,37.46], zoom:11.0, pitch:38, bearing:-22, duration:1600 },
    { center:[129.06,35.16], zoom:9.4, pitch:20, bearing:0, duration:2000 },
    { center:[127.8,36.3], zoom:6.2, pitch:0, bearing:0, duration:1600 },
  ];
  let i = 0;
  const next = () => {
    if(i >= seq.length){
      cancelAnimationFrame(raf);
      const d = frames.slice(6);                       // 워밍업 프레임 제외
      const fps = d.map(x=>1000/x).filter(x=>isFinite(x));
      fps.sort((a,b)=>a-b);
      const avg = fps.reduce((a,b)=>a+b,0)/fps.length;
      const p1  = fps[Math.floor(fps.length*0.01)] || fps[0];
      const set = (el,v)=>{ const n=$(el); n.textContent = v.toFixed(0)+' fps';
        n.className = v>=55?'good':v>=30?'warn':'bad'; };
      set('#stAvg',avg); set('#stMin',fps[0]); set('#stP1',p1);
      $('#fpsLive').textContent = `평균 ${avg.toFixed(0)} · 1% 저점 ${p1.toFixed(0)}`;
      setTimeout(()=>$('#fpsbar').classList.remove('on'), 2600);
      btn.disabled = false; btn.textContent = '⏱  FPS 벤치마크 실행';
      benching = false;
      window.__bench = { avg:+avg.toFixed(1), min:+fps[0].toFixed(1), p1:+p1.toFixed(1),
                         frames:d.length, mode:state.mode, count:state.count };
      return;
    }
    const step = seq[i++];
    map.easeTo({ ...step, essential:true });
    setTimeout(next, step.duration + 60);
  };
  next();
}

/* ---------- boot ---------- */
(async function(){
  const [g, pj, wj, pm] = await Promise.all([
    fetch('korea-sgg.json').then(r=>r.json()),
    fetch('korea-poi.json').then(r=>r.json()),
    fetch('korea-water.json').then(r=>r.json()),
    fetch('photos/_meta.json').then(r=>r.json()).catch(()=>null),
  ]);
  poi = pj; water = wj;

  PHOTO_META = pm || Array.from({length:48},(_,i)=>({i,region:'',scene:''}));
  PHOTOS = PHOTO_META.map(m=>`photos/p${m.i+1}.jpg`);
  imgs = await Promise.all(PHOTOS.map(loadImg));
  /* 데모용 플래그. 축이 서로 독립이라는 점이 드러나게 심는다:
     - mine : 내 기록인가 (소유)
     - sp   : 어느 스페이스 폴더에 묶였나 (소속) — 스페이스 기록도 전부 내 것이다
     - pub  : 전체 공개인가 (공개 범위) — 내 기록 중 일부도 공개된다
     → 내 공개 기록은 `내 지도`와 `모두의 지도` 양쪽에 동시에 존재한다. 정상이다. */
  /* 지역 인지 사진 배정.
     부산 POI에 부산 사진이 가야 지도가 설득력을 갖는다.
     우선순위: 지역+장면 일치 > 지역 일치 > 장면 일치 > 아무거나 */
  const sidoOf = {};
  g.features.forEach(f=>{ sidoOf[f.properties.code] = f.properties.sido; });
  const SCENE_OF = { sight:'sight', beach:'beach', cafe:'cafe', food:'food', bar:'food' };
  REGION_POOL = {}; SCENIC_POOL = [];
  PHOTO_META.forEach(m=>{
    if(m.region) (REGION_POOL[m.region] ||= []).push(m.i);
    if(m.scene==='sight' || m.scene==='beach') SCENIC_POOL.push(m.i);   // 폴리곤엔 풍경만
  });

  const pools = { both:{}, region:{}, scene:{}, any: PHOTO_META.map(m=>m.i) };
  PHOTO_META.forEach(m=>{
    if(m.region){ (pools.region[m.region] ||= []).push(m.i);
                  (pools.both[m.region+'|'+m.scene] ||= []).push(m.i); }
    if(m.scene){ (pools.scene[m.scene] ||= []).push(m.i); }
  });
  const pickPhoto = (p, seed) => {
    const sido = sidoOf[p.r] || '', rn = p.rn || '';
    const sc = SCENE_OF[p.c] || 'sight';
    let keys = Object.keys(pools.region).filter(k => sido.includes(k) || rn.includes(k));
    let pool = null;
    for(const k of keys){ const b=pools.both[k+'|'+sc]; if(b && b.length){ pool=b; break; } }
    if(!pool) for(const k of keys){ if(pools.region[k] && pools.region[k].length){ pool=pools.region[k]; break; } }
    if(!pool) pool = pools.scene[sc] && pools.scene[sc].length ? pools.scene[sc] : pools.any;
    return pool[seed % pool.length];
  };

  poi.features.forEach((f,i)=>{
    const p=f.properties;
    p.imgi = pickPhoto(p, i*31 + 7);           // 지역·장면에 맞는 사진
    p.img  = 'ph' + p.imgi;
    p.au   = 'u' + (1 + (i*7 + (i%5)) % 6);   // 작성자
    p.mine = p.au==='u1';                      // u1이 '나'
    /* ★ 스페이스 소속을 **작성자 기준**으로 준다.
       앞서는 `p.mine ? ... : null` 이라 스페이스에 **내 기록만** 들어갔다 —
       그러면 "우리가 함께 채운"이 성립하지 않는다. 혼자 채운 지도일 뿐이다. */
    const myS = SPACE_OF_USER[p.au] || [];
    p.sp   = myS.length ? myS[i % myS.length] : null;
    if (p.sp && i % 4 === 3) p.sp = null;        // 전부 공유하지는 않는다
    p.pub  = p.mine ? (i%2===0) : (i%9!==0);   // 내 기록은 절반만 공개
    /* ★ 현장 인증 — 실제 앱은 pins.verification. §009가 만든 이 구분이
       뷰어에만 있고 **가장 많이 보는 화면(시트)에는 없었다.** 신뢰가 다른데 똑같이 보였다. */
    p.ver  = (i % 3 === 0) ? 'live' : 'exif';
    /* ★ 기여자 수(nu)와 사진 수(np).
       현실의 분포는 **파워 로우**다 — 대부분 한두 사람, 극소수가 수백 명.
       균등하게 만들면 버킷이 예쁘게 갈리지만 **현실을 왜곡**해서
       런칭 뒤에 기준을 전부 다시 잡아야 한다. 지금부터 치우친 분포로 둔다. */
    const u = Math.max(1, Math.round(Math.pow(1 - ((i * 37) % 1000) / 1000, 6) * 240));
    p.nu = u;                                  // 몇 사람이 올렸나
    p.np = u * (1 + ((i * 13) % 5));           // 사진 수 (한 사람이 1~5장)
  });
  feats = g.features;
  totalPts = feats.reduce((s,f)=>s + f.geometry.coordinates
    .reduce((a,p)=>a + p.reduce((b,r)=>b+r.length,0),0), 0);

  // 전체 bbox
  let w=180,s=90,e=-180,n=-90;
  feats.forEach(f=>{ const b=f.properties.bbox;
    w=Math.min(w,b[0]); s=Math.min(s,b[1]); e=Math.max(e,b[2]); n=Math.max(n,b[3]); });
  g.bbox = [w,s,e,n];
  geo = g;

  map = new maplibregl.Map({
    container:'map',
    style:{ version:8, glyphs:'fonts/{fontstack}/{range}.pbf', sources:{},
            layers:[{ id:'bg', type:'background',
                      paint:{ 'background-color':'#0E0F13' } }] },
    center:[127.8,36.3], zoom:6.2, minZoom:5, maxZoom:16,
    localIdeographFontFamily:'Pretendard, "Apple SD Gothic Neo", sans-serif',
    attributionControl:false, antialias:true, fadeDuration:0,
  });

  map.on('load', ()=>{
    map.addSource('sgg', { type:'geojson', data:geo, promoteId:'code' });

    // 1) 육지 베이스
    map.addLayer({ id:'region-base', type:'fill', source:'sgg',
      paint:{ 'fill-color':'#16181F' } });

    // (사진 레이어가 이 사이에 삽입됨)

    /* 1.5) 수계 — 강·호수.
       행정경계만 있으면 "그냥 땅 덩어리"라 방향 감각이 안 생긴다.
       한강이 보이는 순간 "강남구는 강 남쪽"이 즉시 읽힌다. */
    map.addSource('water', { type:'geojson', data:water });
    map.addLayer({ id:'water-body', type:'fill', source:'water',
      filter:['==',['get','k'],'body'],
      paint:{ 'fill-color':'#0E182E' } });
    map.addLayer({ id:'water-river', type:'line', source:'water',
      filter:['==',['get','k'],'river'],
      layout:{ 'line-cap':'round', 'line-join':'round' },
      paint:{ 'line-color':'#0E182E',
              'line-width':['interpolate',['exponential',1.6],['zoom'],
                  6,  ['match',['get','r'], 3,1.1, 2,0.5, 0.25],
                  10, ['match',['get','r'], 3,4.0, 2,2.0, 1.0],
                  14, ['match',['get','r'], 3,16,  2,7,   3],
                  16, ['match',['get','r'], 3,34,  2,15,  6]],
              'line-opacity':['interpolate',['linear'],['zoom'], 5,0.75, 9,1] } });

    // 2) 미방문 지역 — 사진 bbox 삐져나옴을 덮는다
    map.addLayer({ id:'region-unvisited', type:'fill', source:'sgg',
      paint:{ 'fill-color':'#16181F' }, filter:['==','code','__none__'] });

    // 3) 톤 통일 레이어
    map.addLayer({ id:'veil', type:'fill', source:'sgg',
      paint:{ 'fill-color':'#0E0F13', 'fill-opacity':0.07 } });

    /* 3.5) 집계 열지도 — **전국 줌에서만** 뜬다.
       feature-state 로 칠한다 (source 를 다시 만들 필요가 없어 필터 전환이 즉각적이다). */
    map.addLayer({ id:'region-heat', type:'fill', source:'sgg',
      /* ★ 선형으로 칠하면 거의 다 0에 붙는다 — 실측 최대 1,230곳 / 중앙값 8곳.
         한 지역(서울)만 빨갛고 나머지는 전부 검게 보인다. **로그로 편다.** */
      paint:{ 'fill-color':'#38B6FF',
              'fill-opacity':['interpolate',['linear'],
                 ['coalesce',['feature-state','lg'],0],
                 0,0, 0.25,0.05, 0.55,0.26, 0.8,0.52, 1,0.82] } });

    // 4) hairline 경계
    map.addLayer({ id:'region-line', type:'line', source:'sgg',
      paint:{ 'line-color':'rgba(255,255,255,0.08)',
              'line-width':['interpolate',['linear'],['zoom'], 5,0.4, 9,0.7, 13,1.1] } });

    // 5) hover 강조
    map.addLayer({ id:'region-hover', type:'line', source:'sgg',
      paint:{ 'line-color':'#38B6FF', 'line-width':1.6 },
      filter:['==','code','__none__'] });

    /* 5.5) 집계 숫자 — 이름과 곳 수. 색만으로는 "많다"가 몇인지 모른다. */
    map.addSource('sggPt', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    map.addLayer({ id:'region-count', type:'symbol', source:'sggPt',
      /* ★ 처음엔 이름이 안 나와서 *"한글 글리프가 없다"* 고 결론 내렸는데 **틀렸다.**
         `localIdeographFontFamily` 가 설정돼 있어 한글은 **브라우저 폰트로 그려진다.**
         진짜 원인은 `text-font` 를 안 적은 것이었다 — 기본값
         `Open Sans Regular` 가 우리 글리프 폴더에 없어서 **레이어 전체가 렌더에 실패했다.**
         숫자도 같이 안 나왔는데 그걸 한글 탓으로 돌렸다. (§13.12) */
      layout:{ 'text-field':['format',
                 ['get','name'], { 'font-scale':0.8 },
                 '\n', {},
                 ['concat',['to-string',['get','n']],'곳'], {}],
               'text-font':['Noto Sans Regular'],
               'text-line-height':1.25,
               'text-size':['interpolate',['linear'],['zoom'], 5,10, 8,13],
               'text-allow-overlap':false, 'text-padding':4 },
      paint:{ 'text-color':'#F2F3F5', 'text-halo-color':'#0E0F13', 'text-halo-width':1.4 } });

    /* ---------- 장소 핀 (실제 OSM 데이터) ---------- */
    imgs.forEach((im,i)=>{
      Object.entries(CAT).forEach(([k,v])=>{
        const id='ph'+i+'_'+k;
        if(!map.hasImage(id)) map.addImage(id, circleIcon(im, v.c));
      });
      // 클러스터용: 카테고리가 섞여 있으므로 중립 흰 테두리
      if(!map.hasImage('phc'+i)) map.addImage('phc'+i, circleIcon(im, 'rgba(255,255,255,0.92)'));
    });

    /* 클러스터의 대표 사진을 고르는 방법:
       MapLibre의 clusterProperties는 누적 연산만 지원하므로 "가장 반응 좋은 멤버의 사진"을
       직접 뽑을 수 없다. → likes와 이미지 인덱스를 한 숫자로 인코딩해 max를 취한다.
       top = likes*100 + imgi   →   likes = ⌊top/100⌋,  imgi = top%100 */
    map.addSource('poi', { type:'geojson', data:poi, cluster:true,
      clusterMaxZoom:11, clusterRadius:68,
      clusterProperties:{ top:['max',['+',['*',['get','likes'],100],['get','imgi']]] } });

    /* 클러스터도 사진으로 보여준다.
       숫자만 있는 원은 부동산 앱처럼 읽힌다 — 이 앱은 "얼마나 있나"가 아니라
       "어떤 곳인가"를 먼저 말해야 한다. 개수는 배지로 뺀다. */
    const CSIZE = ['interpolate',['linear'],['get','point_count'],
                     2,0.42, 20,0.56, 200,0.72, 1000,0.90];

    map.addLayer({ id:'poi-cluster', type:'symbol', source:'poi',
      filter:['has','point_count'],
      layout:{ 'icon-image':['concat','phc',['to-string',['%',['get','top'],100]]],
               'icon-allow-overlap':true, 'icon-size':CSIZE,
               'symbol-sort-key':['-',0,['get','point_count']] },
      paint:{ 'icon-opacity':['interpolate',['linear'],['zoom'], 9.0,0, 9.6,1] } });

    // 개수 배지 — 아이콘 오른쪽 위
    /* 배지는 3곳 이상일 때만. 2곳짜리에까지 붙이면 사진보다 배지가 커 보인다. */
    const BADGE = ['interpolate',['linear'],['get','point_count'], 3,6.6, 20,8.8, 200,11.2, 1000,13.6];
    map.addLayer({ id:'poi-cluster-badge', type:'circle', source:'poi',
      filter:['all',['has','point_count'],['>=',['get','point_count'],3]],
      paint:{ 'circle-color':'#38B6FF',
              'circle-radius':BADGE,
              'circle-translate':['literal',[13,-13]],
              'circle-stroke-width':1.6, 'circle-stroke-color':'rgba(10,11,15,0.9)',
              'circle-opacity':['interpolate',['linear'],['zoom'], 9.0,0, 9.6,1],
              'circle-stroke-opacity':['interpolate',['linear'],['zoom'], 9.0,0, 9.6,1] } });

    map.addLayer({ id:'poi-cluster-n', type:'symbol', source:'poi',
      filter:['all',['has','point_count'],['>=',['get','point_count'],3]],
      layout:{ 'text-field':['get','point_count_abbreviated'],
               'text-font':['Noto Sans Regular'],
               'text-size':['interpolate',['linear'],['get','point_count'], 3,9.5, 200,11.5, 1000,13],
               'text-allow-overlap':true, 'text-ignore-placement':true,
               'text-offset':['literal',[0,0]] },
      paint:{ 'text-color':'#fff',
              'text-translate':['literal',[13,-13]],
              'text-opacity':['interpolate',['linear'],['zoom'], 9.0,0, 9.6,1] } });

    // 상위권 밖 장소 — "여기도 뭐 있음"만 알려주는 작은 점
    map.addLayer({ id:'poi-dot', type:'circle', source:'poi',
      filter:['all',['!',['has','point_count']],['>=',['get','rk'], 9999]],
      paint:{ /* 점은 무채색. 맛집이 43%라 카테고리 색을 쓰면 화면이 주황 덩어리가 된다.
                 점의 역할은 "여기도 뭐 있음"이지 "무엇인지"가 아니다. */
              'circle-color':'#9AA0AA',
              'circle-radius':['interpolate',['linear'],['zoom'], 11,2.2, 14,3.4, 16,4.4],
              'circle-opacity':['interpolate',['linear'],['zoom'], 9.2,0, 10,0.62],
              'circle-stroke-width':0.6,
              'circle-stroke-color':'rgba(0,0,0,0.45)',
              'circle-stroke-opacity':['interpolate',['linear'],['zoom'], 9.2,0, 10,0.5] } });

    // 반경 링 + 기준점 마커
    map.addSource('radius', { type:'geojson', data:{type:'FeatureCollection',features:[]} });
    map.addLayer({ id:'radius-fill', type:'fill', source:'radius',
      paint:{ 'fill-color':'#38B6FF', 'fill-opacity':0.06 } });
    map.addLayer({ id:'radius-line', type:'line', source:'radius',
      paint:{ 'line-color':'#38B6FF', 'line-width':1.4, 'line-opacity':0.55, 'line-dasharray':[2,2] } });

    map.addSource('anchor', { type:'geojson', data:{type:'FeatureCollection',features:[]} });
    map.addLayer({ id:'anchor-halo', type:'circle', source:'anchor',
      paint:{ 'circle-radius':16, 'circle-color':'#38B6FF', 'circle-opacity':0.18 } });
    map.addLayer({ id:'anchor-dot', type:'circle', source:'anchor',
      paint:{ 'circle-radius':7, 'circle-color':'#38B6FF',
              'circle-stroke-width':2.5, 'circle-stroke-color':'#fff' } });

    /* 아이콘과 라벨은 반드시 한 레이어여야 한다.
       분리하면 두 레이어가 서로 충돌 처리를 해서 라벨이 아이콘을 밀어낸다.
       라벨은 z12.4 미만에서 빈 문자열 → 충돌 박스 자체가 생기지 않는다. */
    map.addLayer({ id:'poi-pin', type:'symbol', source:'poi',
      filter:['all',['!',['has','point_count']],['<',['get','rk'], 9999]],
      layout:{ 'icon-image':['concat',['get','img'],'_',['get','c']],
               'icon-allow-overlap':false, 'icon-padding':2,
               'symbol-sort-key':['-',0,['get','likes']],
               'icon-size':['interpolate',['linear'],['zoom'], 9,0.11, 11,0.25, 13,0.40, 16,0.56],
               /* 임계값은 반드시 정수 줌 — 심볼 레이아웃은 타일 줌에서 평가된다 */
               'text-field':['step',['zoom'], '', 12, ['get','n']],
               'text-font':['Noto Sans Regular'],
               'text-size':['interpolate',['linear'],['zoom'], 12.4,10.5, 16,13],
               'text-offset':['interpolate',['linear'],['zoom'],
                               12.4,['literal',[0,1.5]], 16,['literal',[0,1.9]]],
               'text-anchor':'top', 'text-optional':true, 'text-padding':3 },
      paint:{ 'icon-opacity':['interpolate',['linear'],['zoom'], 9.2,0, 9.8,1],
              'text-color':'#E9EBEF', 'text-halo-color':'rgba(0,0,0,0.88)', 'text-halo-width':1.5,
              'text-opacity':['interpolate',['linear'],['zoom'], 12.4,0, 13.0,1] } });

    applyTheme();
    applyPins();
    render();
    renderChips();
    renderLensMenu();
    renderScopes();
    refreshPoi();

    map.on('moveend', ()=>{
      clearTimeout(listTimer);
      listTimer=setTimeout(()=>{ refreshPoi(); loadServerPins(); },180);
    });
    // 줌은 즉시 반응해야 한다 — 180ms 뒤에 단위가 바뀌면 손이 먼저 가 있다
    map.on('zoom', applyZoomUnit);
    /* ★ 전국 줌으로 **나갔을 때** 스코프를 푼다. 안 풀면 집계가 한 지역만 칠해져
       "전국을 보는데 한 곳만 색이 있다"는 이상한 화면이 된다.
       ★ 이 검사를 `zoom`(매 프레임)에 걸었더니, 지역을 탭해 **들어가는 애니메이션 도중**
         아직 전국 줌이라 방금 건 스코프가 즉시 풀렸다. 끝난 뒤에 한 번만 본다. */
    map.on('zoomend', ()=>{
      if(zoomUnit(map.getZoom())==='region' && state.region) clearRegionScope();
    });

    /* ★ 집계 지역을 탭하면 그 지역으로 들어간다.
       전국 → 지역 → 장소로 **좁혀 들어가는 길**이 이걸로 이어진다.
       집계 줌에서만 받는다 — 확대된 상태에서 지역을 탭하면 핀을 노린 손가락을 가로챈다. */
    map.on('click', e=>{
      if(zoomUnit(map.getZoom()) !== 'region') return;
      const f = map.queryRenderedFeatures(e.point, { layers:['region-heat','region-base'] })[0];
      if(!f) return;
      const code = f.properties.code || f.id;
      const g = feats.find(x=>x.properties.code === code);
      if(!g || !g.properties.bbox) return;
      setRegionScope(code, g.properties.name);
      const b = g.properties.bbox;
      const pad = { top:70, left:40, right:40, bottom:260 };
      /* ★ 그냥 fitBounds 하면 **넓은 지역은 집계 줌에 그대로 머문다** —
         강릉시를 눌렀더니 z8.7 이라 여전히 '지역' 단위였다. 탭했는데 아무 일도
         안 일어난 것처럼 보인다. 무엇을 눌렀든 **장소 단위까지는 들어간다.** */
      const cam = map.cameraForBounds([[b[0],b[1]],[b[2],b[3]]], { padding:pad });
      map.easeTo({ center: cam ? cam.center : [(b[0]+b[2])/2,(b[1]+b[3])/2],
                   zoom: Math.min(12.5, Math.max(Z_REGION + 0.3, cam ? cam.zoom : Z_REGION + 0.3)),
                   duration:700 });
    });
    map.on('mouseenter','region-heat', ()=>{ map.getCanvas().style.cursor='pointer'; });
    map.on('mouseleave','region-heat', ()=>{ map.getCanvas().style.cursor=''; });

    let hovered = null;
    map.on('mousemove', e=>{
      const f = map.queryRenderedFeatures(e.point,{layers:['region-base']})[0];
      const tip = $('#hover');
      if(f){
        if(f.properties.code !== hovered){
          hovered = f.properties.code;
          map.setFilter('region-hover',['==','code',hovered]);
        }
        tip.classList.add('on');
        tip.style.left = e.point.x+'px'; tip.style.top = e.point.y+'px';
        tip.textContent = f.properties.name;
      } else { hovered=null; map.setFilter('region-hover',['==','code','__none__']);
               tip.classList.remove('on'); }
    });

    $('#panel').classList.add('hidden');
    $('#stats').classList.add('hidden');
    $('#boot').classList.add('off');
    if (window.initUpload) window.initUpload();
    if (window.initSpaces) window.initSpaces();
    if (window.initFeed) window.initFeed();
    if (window.initHome) window.initHome();
    if (window.initMy) window.initMy();
    /* ★ **시작할 때 세션을 확인한다.** §13.30 에서 RN 에 넣은 것을 웹은 마이 탭에만
       걸어 뒀다 — 그래서 지도·등록은 지워진 계정의 토큰으로 먼저 움직였고,
       쓰기가 전부 `23503 (profiles 없음)` 으로 튕겼다. 검증 중 세 번을 "LINKS 캐시
       탓"으로 잘못 짚었다. **한쪽만 고친 것은 고친 게 아니다**(§13.39 에서 같은 말을
       적어 놓고 또 반쪽만 했다). */
    if (window.API && API.on) API.ensureSession().then(() => {
      if (window.loadServerPins) loadServerPins(true);
    });
    else if (window.loadServerPins) loadServerPins(true);
    window.__ready = true;
  });

  // controls
  const wire = (sel, key, cast=String, after=render) => {
    $(sel).addEventListener('click', ev=>{
      const b = ev.target.closest('button'); if(!b) return;
      [...ev.currentTarget.children].forEach(c=>c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      state[key] = cast(b.dataset.v);
      after();
    });
  };
  wire('#segMode','mode');
  wire('#segCount','count',Number);
  wire('#segTheme','theme',String,()=>{ applyTheme(); });
  wire('#segContrast','contrast',String,()=>{ applyTheme(); });
  wire('#segPins','pins',v=>v==='on',()=>applyPins());
  wire('#segQuota','quota',v=>v==='on',()=>refreshPoi());
  wire('#segMosaic','mosaic',v=>v==='on',()=>render());
  wire('#segVeil','veil',v=>v==='on',()=>applyVeil());
  $('#bench').addEventListener('click', bench);

  // ---- 검색 ----
  const openSearch = () => { $('#searchWrap').classList.add('open');
    $('#searchIn').value=''; runSearch(''); setTimeout(()=>$('#searchIn').focus(),40); };
  $('#btnSearch').addEventListener('click', openSearch);
  $('#searchWrap').addEventListener('click', e=>{ if(e.target.id==='searchWrap')
    $('#searchWrap').classList.remove('open'); });
  $('#searchIn').addEventListener('input', e=>runSearch(e.target.value));
  $('#searchRes').addEventListener('click', ev=>{
    const row=ev.target.closest('.sres'); if(!row) return;
    const x=+row.dataset.x, y=+row.dataset.y, z=+row.dataset.z, label=row.dataset.label;
    $('#searchWrap').classList.remove('open');
    if(ev.target.closest('[data-anchor]')) setAnchor(y, x, label);
    else { map.flyTo({center:[x,y], zoom:z, duration:900}); }
  });

  // ---- 내 위치 ----
  $('#btnGps').addEventListener('click', ()=>{
    if(state.anchor){ clearAnchor(); return; }
    const fallback = ()=> setAnchor(35.1585, 129.1604, '내 위치(데모·해운대)');
    if(!navigator.geolocation) return fallback();
    navigator.geolocation.getCurrentPosition(
      pos => setAnchor(pos.coords.latitude, pos.coords.longitude, '내 위치'),
      fallback, {timeout:4000});
  });

  $('#anchorClear').addEventListener('click', clearAnchor);
  $('#radSeg').addEventListener('click', ev=>{
    const b=ev.target.closest('button'); if(!b) return;
    [...ev.currentTarget.children].forEach(c=>c.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    state.radius=+b.dataset.v; drawRadius(); refreshPoi();
  });
  $('#sortSeg').addEventListener('click', ev=>{
    const b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.v==='near' && !state.anchor){
      alert('먼저 기준점을 정해주세요.\n📍 버튼(내 위치) 또는 검색 결과의 [기준]'); return;
    }
    [...ev.currentTarget.children].forEach(c=>c.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    state.sort=b.dataset.v; renderList();
  });

  // 지도를 길게 누르면 그 자리를 기준점으로
  let pressT=null;
  map.on('mousedown', e=>{ pressT=setTimeout(()=>setAnchor(e.lngLat.lat,e.lngLat.lng,'지정한 위치',false),600); });
  ['mouseup','mousemove','dragstart'].forEach(ev=>map.on(ev,()=>clearTimeout(pressT)));

  $('#devToggle').addEventListener('click', ()=>{
    $('#panel').classList.toggle('hidden');
    $('#stats').classList.toggle('hidden');
  });

  $('#lensBtn').addEventListener('click', e=>{
    e.stopPropagation(); $('#lensMenu').classList.toggle('open');
  });
  document.addEventListener('click', ()=> $('#lensMenu').classList.remove('open'));
  $('#lensMenu').addEventListener('click', ev=>{
    ev.stopPropagation();
    const b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.v==='__new'){
      alert('새 스페이스 — 여행 폴더를 만들고 카톡으로 지인을 초대합니다.\n(프로토타입에서는 생성 UI 생략)');
      return;
    }
    state.lens=b.dataset.v;
    $('#lensMenu').classList.remove('open');
    renderLensMenu(); refreshPoi();
  });

  $('#chips').addEventListener('click', ev=>{
    const b=ev.target.closest('.chip'); if(!b) return;
    state.cat=b.dataset.v; renderChips(); refreshPoi();
  });

  $('#regionX').addEventListener('click', clearRegionScope);

  $('#scopes').addEventListener('click', ev=>{
    const b=ev.target.closest('.schip'); if(!b) return;
    setScope(b.dataset.scope);
  });

  $('#trust').addEventListener('click', ev=>{
    const b=ev.target.closest('.tchip'); if(!b) return;
    state.minU = +b.dataset.u;
    renderTrust(); refreshPoi();          // 지도와 목록이 같이 줄어야 한다
  });

  $('#grab').addEventListener('click', ()=>{
    state.sheet = state.sheet==='peek' ? 'expanded' : 'peek';
    $('#sheet').classList.toggle('expanded', state.sheet==='expanded');
  });

  $('#list').addEventListener('click', ev=>{
    const a=ev.target.closest('.cauthor');
    if(a){ ev.stopPropagation(); state.lens='p_'+a.dataset.au;
           renderLensMenu(); refreshPoi(); return; }
    const c=ev.target.closest('.card'); if(!c) return;
    map.flyTo({ center:[+c.dataset.x, +c.dataset.y],
                zoom:Math.max(map.getZoom(),14.2), duration:700 });
  });
  window.__bench_run = bench;
})();
</script>
<!-- 캐시 무효화: 수정이 반영 안 돼 같은 버그를 두 번 쫓은 적이 있다 -->

  for (const f of ["api", "log", "upload", "spaces", "feed", "home", "my", "uismoke"]) {
    const t = document.createElement("script");
    t.src = f + ".js?v=" + Date.now();
    t.async = false;
    document.head.appendChild(t);
  }
