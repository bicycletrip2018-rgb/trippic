# =====================================================================
# 행사 날짜 주 1회 갱신 (§13.88)
#
# ★ 왜 자동인가 — §13.87 에서 **날짜가 1년 묵어 있었다.** 같은 축제가 contentid 는
#   그대로인데 해마다 날짜가 바뀌어서, 손으로 안 돌리면 *"올해 축제의 작년 날짜"* 를
#   들고 있게 된다. 행사는 **날짜가 생명**이라 이건 틀린 정보지 낡은 정보가 아니다.
#
# ★ 왜 목요일 아침인가 — 사람은 **주중에 주말 계획을 세운다.** 금·토 축제가 목요일에
#   최신이어야 쓸모가 있다. 월요일에 돌리면 그 주 주말 정보가 엿새 묵는다.
#   목 06:00 KST = 수 21:00 UTC.
#
# ★ 넣을 비밀 두 개 (저장소 → Settings → Secrets and variables → Actions):
#     DB_URL       Supabase 연결 문자열
#     TOURAPI_KEY  공공데이터포털 서비스키
#   ★ 둘 다 **없으면 그냥 건너뛴다.** 포크나 비밀을 안 넣은 저장소에서 빨간 X 가
#     계속 뜨면 사람들은 그 알림을 끄고, 그때부터 진짜 실패도 안 보인다.
# =====================================================================
name: 행사 날짜 갱신

on:
  schedule:
    - cron: "0 21 * * 3"      # 수 21:00 UTC = 목 06:00 KST
  workflow_dispatch:           # 손으로도 돌릴 수 있게
    inputs:
      from:
        description: "이 날짜부터 받는다 (YYYYMMDD)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # 이 스크립트는 **표준 라이브러리만** 쓴다 — 설치할 것이 없다

      - name: psql 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 비밀이 있는지 본다
        id: has
        env:
          DB_URL: ${{ secrets.DB_URL }}
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        run: |
          if [ -n "$DB_URL" ] && [ -n "$TOURAPI_KEY" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::notice::DB_URL / TOURAPI_KEY 가 없어 건너뜁니다."
          fi

      - name: 행사 날짜 갱신
        if: steps.has.outputs.ok == 'yes'
        env:
          DB_URL: ${{ secrets.DB_URL }}
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
          # ★ 올해 1월부터 받는다. 올해 치만 받으면 **연말에 내년 축제를 놓친다** —
          #   API 는 eventStartDate 이후를 주므로 시작일을 올해로 두면 내년 것도 따라온다.
          FROM: ${{ github.event.inputs.from }}
        run: |
          set -euo pipefail
          FROM="${FROM:-$(date -u +%Y)0101}"
          echo "▶ $FROM 부터"
          # ★ **한 번 더 시도한다**(§13.88). 첫 실행이 러너에서 `URLError` 로 죽었고
          #   두 번째는 44초에 끝났다 — 일시적 오류다. 스크립트 안에도 3회 재시도가
          #   있지만 그 셋이 한꺼번에 실패하는 창이 있었다.
          #   ★ 주 1회짜리 일에서 한 번 놓치면 **일주일이 묵는다.** 그게 이 작업이
          #     막으려던 바로 그것이라, 2분 기다렸다 한 번 더 거는 값이 싸다.
          python3 db/import/06_festival_dates.py --from "$FROM" || {
            echo "::warning::첫 시도 실패 — 2분 뒤 한 번 더"
            sleep 120
            python3 db/import/06_festival_dates.py --from "$FROM"
          }

      - name: 결과 요약
        if: steps.has.outputs.ok == 'yes'
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          psql -X -q -d "$DB_URL" -c "
            select count(*) filter (where event_start<=current_date
                                      and coalesce(event_end,event_start)>=current_date) as 진행중,
                   count(*) filter (where event_start>current_date) as 예정,
                   count(*) filter (where event_start is not null) as 기간있음
              from public.places;" >> "$GITHUB_STEP_SUMMARY"
