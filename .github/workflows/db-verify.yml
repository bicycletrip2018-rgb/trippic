# =====================================================================
# DB 검증 — **배포 전 벽을 CI 에서도 돌린다** (§13.124)
#
# ★ 왜 — §13.122·§13.123 이 세운 운영자 벽의 읽기 쪽은 **런타임 벽이 아니다.**
#   `verify.sh` 를 돌려야만 걸린다. 그 말은 *"안 돌리고 올리면 없는 것과 같다"* 는
#   뜻이고, 실제로 사람이 잊는다. 그래서 **밀 때마다 기계가 돌린다.**
#
# ★ 여기서 도는 것은 로컬과 **같은 스크립트**다(`db/local/verify.sh`).
#   CI 전용 검사를 따로 만들면 둘이 어긋나고, 어긋나는 쪽은 늘 안 보는 쪽이다.
#
# ★ PostGIS 는 안 깐다 — 로컬과 같은 스텁을 쓴다(의존성 133개, 5~8GB).
#   그래서 **공간 연산의 정확성은 여기서 안 재진다.** 재는 것은
#   스키마·RLS·권한·랭킹·운영자 벽이다. 과장하지 않는다.
#
# ★ `DB_URL` 비밀이 있으면 **실서버 표류**까지 본다(로컬만 통과하고 안 올린 적이
#   있다 — 008·009). 없으면 그 단계만 건너뛴다. 포크에서 빨간 X 가 계속 뜨면
#   사람들이 알림을 끄고, 그때부터 진짜 실패도 안 보인다.
# =====================================================================
name: DB 검증 (배포 전 벽)

on:
  push:
    paths: ["db/**", ".github/workflows/db-verify.yml"]
  pull_request:
    paths: ["db/**", ".github/workflows/db-verify.yml"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 한글 로케일 (없으면 검색 시험이 **거짓으로 통과한다**)
        # pg_trgm 은 LC_CTYPE 으로 한글을 '문자'로 볼지 정한다. C 로케일이면
        # 트라이그램이 통째로 비어 similarity() 가 늘 0 → 시험이 아무것도 안 재면서
        # 전부 통과한다. verify.sh 가 이걸 확인하고 없으면 멈춘다.
        run: sudo locale-gen en_US.UTF-8 && locale -a | grep -i en_US

      - name: PostgreSQL 16 찾기
        id: pg
        run: |
          BIN=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$BIN" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-16
            BIN=/usr/lib/postgresql/16/bin
          fi
          echo "PGBIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/postgres" --version

      - name: 검증 (문법 → 동작 → **배포 전 벽**)
        env:
          PGBIN: ${{ env.PGBIN }}
          DB_URL: ${{ secrets.DB_URL }}       # 없으면 표류 점검만 건너뛴다
        run: ./db/local/verify.sh

      - name: 실패하면 서버 로그를 남긴다
        if: failure()
        run: tail -50 /tmp/trippic_pg.log || true
